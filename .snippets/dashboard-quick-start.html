<!-- Balance Overview (3-column grid) -->
<div class="cb-balance-overview">
  <div class="cb-balance-card">
    <div class="cb-balance-label">Total Balance</div>
    <div class="cb-balance-amount">$0.00</div>
    <div class="cb-balance-change positive"><span class="arrow">↑</span> +0%</div>
  </div>
  <div class="cb-balance-card">
    <div class="cb-balance-label">Invested</div>
    <div class="cb-balance-amount">$0.00</div>
    <div class="cb-balance-change positive"><span class="arrow">↑</span> +0%</div>
  </div>
  <div class="cb-balance-card">
    <div class="cb-balance-label">Available</div>
    <div class="cb-balance-amount">$0.00</div>
    <div class="cb-balance-change">—</div>
  </div>
</div>

<!-- Paper Trading Banner -->
<div class="cb-paper-trading" id="klarpakke-paper-trading-root" data-kp-feature="paper-trading">
  <div class="cb-paper-trading-header">
    <h3>Paper Trading Mode</h3>
    <span class="cb-badge cb-badge-paper-trading" data-paper-trading-badge>⚪ Demo Account</span>
  </div>
  <div class="cb-paper-trading-stats">
    <div class="cb-paper-stat">
      <div class="cb-paper-stat-label">Virtual Balance</div>
      <div class="cb-paper-stat-value">$10,000.00</div>
    </div>
  </div>
</div>
