version: 1
agent:
  extend: default
  name: klarpakke-trading-engine
  description: >-
    Trading Engine-spesialist for Klarpakke. Dyp ekspertise på:
    - Paper trading vs live trading parity
    - Binance executor, rate limits, error handling
    - FIFO PnL, position ledger, session lifecycle
    - Confluent Signal Engine, strategy bots (DCA, trend, grid, multi, AI-copy)
    - Auto-trade vs Autopilot arkitektur
    - Trading-math suite (Monte Carlo, Walk-Forward, Risk Metrics)
    - pg_cron trading jobs og tick-scheduler

    ALLTID bruker denne agenten MemPalace search på "trading-engine",
    "trading-audit", "binance-executor" før endringer.
    ALLTID verifiserer at paper=live etter trading-endringer.
  system_prompt_path: ./klarpakke-trading-engine-agent.md
  # MCP: full (trenger Supabase, Sanity, Cron, Monitor)
