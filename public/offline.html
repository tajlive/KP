<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Klarpakke</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0A0B0D;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .container { text-align: center; max-width: 400px; }
    .icon { font-size: 4rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.75rem; }
    p { color: #9ca3af; margin-bottom: 2rem; line-height: 1.6; }
    button {
      background: #0052FF;
      color: #fff;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #003fcc; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Du er offline</h1>
    <p>Klarpakke trenger internett for sanntidsdata. Sjekk tilkoblingen din og prøv igjen.</p>
    <button onclick="location.reload()">Prøv igjen</button>
  </div>
</body>
</html>
