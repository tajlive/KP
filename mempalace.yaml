wing: klarpakke
version: "2.0"

# RAW MODE - M1 Mac ChromaDB workaround
# Vector search deaktivert, bruker grep-basert søk
storage:
  mode: raw
  search_backend: grep
  aaak_compression: true

# Rom-konfigurasjon med prioriteringer
rooms:
  # HIGH PRIORITY - Kritisk kunnskap
  - name: critical_decisions
    description: ADR-er og arkitektur-beslutninger
    priority: high
    retention: permanent
    sources:
      - docs/adr/*.md
      - docs/*DECISION*.md
      
  - name: error_patterns
    description: Feil og løsninger
    priority: high
    retention: permanent
    sources:
      - .knowledge/errors/*.md
      - src/**/*.ts {TODO,FIXME,HACK}
      
  - name: auth_system
    description: Auth-mønstre og fixes
    priority: high
    retention: 2years
    sources:
      - docs/auth-storage.md
      - AUTH-ISSUE-DIAGNOSIS*.md
      
  # MEDIUM PRIORITY - Teknisk gjeld
  - name: tech_debt
    description: TYPE_DEBT og refaktoreringsbehov
    priority: medium
    retention: 1year
    sources:
      - src/lib/supabase/TYPE_DEBT.md
      - docs/TYPE-DEBT-ROADMAP*.md
      
  - name: api_contracts
    description: API-dokumentasjon
    priority: medium
    retention: 1year
    sources:
      - docs/api-routes.md
      - src/app/api/**/*.ts
      
  # STANDARD PRIORITY - Prosjektinfo
  - name: project_status
    description: Statusrapporter og runbooks
    priority: standard
    retention: 6months
    sources:
      - PROJECT_STATUS.md
      - PRODUCTION-READINESS*.md
      - runbook.md
      
  - name: kimi_sessions
    description: KIMI diary entries
    priority: standard
    retention: 1year
    auto_populate: true
    
  # LOW PRIORITY - Arkiv
  - name: archive
    description: Gamle rapporter og logs
    priority: low
    retention: 3months

# Søke-konfigurasjon
search:
  fallback_to_grep: true
  grep_options: "-r -i -n --include='*.md' --include='*.ts' --include='*.tsx'"
  max_results: 10
  
# Knowledge Graph
knowledge_graph:
  enabled: true
  auto_extract_relations: true
  
# Diary
diary:
  enabled: true
  format: aaak
  auto_write_on_task_complete: true
