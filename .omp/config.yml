# Klarpakke OMP 16.2.12 + KIMI K2.7 Code project overlay
# This overlay locks project sessions to KIMI K2.7 Code and tunes tool/verbosity
# settings for the Klarpakke codebase. Values here override the global
# ~/.omp/agent/config.yml only for this repository.

# Keep the project independent of Cursor/Claude/Gemini/Antigravity/.agent discovery.
disabledProviders:
  - cursor
  - claude
  - codex
  - gemini
  - opencode
  - github
  - agents
  - agents-md

# Lock every model role to KIMI K2.7 Code via the kimi-k2-7-code provider.
# High-thinking for reasoning roles; plain for smol/fast work.
modelRoles:
  default: kimi-k2-7-code/kimi-for-coding:high
  plan: kimi-k2-7-code/kimi-for-coding:high
  slow: kimi-k2-7-code/kimi-for-coding:high
  advisor: kimi-k2-7-code/kimi-for-coding:high
  vision: kimi-k2-7-code/kimi-for-coding:high
  designer: kimi-k2-7-code/kimi-for-coding:high
  task: kimi-k2-7-code/kimi-for-coding:high
  smol: kimi-k2-7-code/kimi-for-coding
  commit: kimi-k2-7-code/kimi-for-coding:high

# Leverage K2.7 Code's reasoning by default for architect/integrity work.
defaultThinkingLevel: high

# Keep engineering output concise; K2.7 Code is strong enough to be terse.
textVerbosity: medium

# Native KIMI tool format gives the most reliable tool-use fidelity.
tools:
  format: kimi
