# Klarpakke OMP 16.3.6 + KIMI K2.7 Code project overlay
# This overlay locks project sessions to KIMI K2.7 Code and tunes tool/verbosity
# settings for the Klarpakke codebase. Values here override the global
# ~/.omp/agent/config.yml only for this repository.

# Keep the project independent of Cursor/Claude/Gemini/Antigravity/.agent discovery.
disabledProviders:
  - cursor
  - claude
  - codex
  - gemini
  - opencode
  - github
  - agents
  - agents-md
  - llama.cpp
  - ollama
  - lm-studio

# Lock every model role to KIMI K2.7 Code via the kimi-k2-7-code provider.
# High-thinking for reasoning roles; plain for smol/fast work.
modelRoles:
  default: kimi-k2-7-code/kimi-for-coding:high
  plan: kimi-k2-7-code/kimi-for-coding:high
  slow: kimi-k2-7-code/kimi-for-coding:high
  advisor: kimi-k2-7-code/kimi-for-coding:high
  vision: kimi-k2-7-code/kimi-for-coding:high
  designer: kimi-k2-7-code/kimi-for-coding:high
  task: kimi-k2-7-code/kimi-for-coding:medium
  smol: kimi-k2-7-code/kimi-for-coding:medium
  commit: kimi-k2-7-code/kimi-for-coding:medium

# Leverage K2.7 Code's reasoning by default for architect/integrity work.
# This is the intended project default; per-message overrides are still available.
defaultThinkingLevel: high

# Keep engineering output concise; K2.7 Code is strong enough to be terse.
textVerbosity: medium

# Native KIMI tool format gives the most reliable tool-use fidelity.
tools:
  format: kimi
  approvalMode: yolo

# Tuned for 8 GB M1 macOS running 4 parallel KIMI K2.7 Code streams.
# Live test with 6 subagents completed, but WorkerC was heavily delayed (160s total
# vs ~30s for peers), showing scheduling stalls at N=6. 4 keeps response times
# predictable while preserving good parallelism. eager: always keeps subagents
# responsive and reduces apparent "pauses" between tool/model turns.
task:
  maxConcurrency: 4
  eager: always

# Autolearn disabled to avoid background agent work and skill capture overhead.
autolearn:
  enabled: false
  autoContinue: false

# Cap context growth so maintenance/compaction does not dominate long sessions.
# (OMP global config governs the exact threshold; this key documents the intent.)
provider:
  appendOnlyContext: false

# Project MCP servers live in .omp/mcp.json so OMP does not depend on disabled
# Cursor/Claude discovery providers for filesystem, Supabase, GitHub, Perplexity,
# Sanity, or MemPalace access.
