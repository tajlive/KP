# Blyt policies — Klarpakke (Master Prompt v4.0 §7-§13)

git:
  workflow:
    [Issue, Branch, Implementation, Tests, Commit, CI, Review, Main, Deploy]
  main_protection: "direkte push til main er IKKE standard — kun via review etter grønne gates + Linear-issue (v4.1 §9)"
  branch_naming: "<KLA-nummer>-<kort-navn> (f.eks. blyt-control-plane-v1 → KLA-274)"
  commit_message: "KLA-nummer i body/header der det finnes — ingen commit uten grønn test + Linear issue + dokumentert endring (v4.1 §8)"

linear:
  sso: "Linear er ENESTE oppgavekilde — Trello er utfaset som aktiv styring"
  gate_ready_for_tom_to_approved: "kun Tom"
  auto_commit_policy: "K3/Hermes committer kun ved grønne gates (tsc+eslint+vitest)"

secrets:
  aldri_i: [git, kode, dokumentasjon, chat, hermes-config]
  standard: "secret://<prosjekt>/<miljø>/<tjeneste>/<nøkkel>"
  agent_kan: [bruke, referere]
  agent_kan_ikke: [eksponere, skrive uten godkjenning]
  gaps:
    - finding: "~/.hermes/config.yaml inneholder tokens (linje 435 gho_…, linje 501 Bearer sbp_…)"
      rule: "Master Prompt §4"
      plan: "flytt til env.local/BWS + erstatt med referanse — egen oppgave, ingen endring nå (verifisert 2026-08-12 read-only)"

codex:
  gap: "approval_policy=never lokalt — skjerpes før Codex brukes på risikofylt arbeid"

trading:
  standard_flags:
    OKX_ENABLED: "false"
    RL_ENABLED: "false"
    WEIGHT_LEARNING_ENABLED: "false"
  live: "kun Tom — ingen agent åpner live trading, endrer risiko eller øker posisjon uten Tom"
  kill_switch: "POST /api/admin/kill-switch med CRON_SECRET"

quality:
  foer_commit: [lint, tsc --noEmit, tests, build]
  minimum: "npx tsc --noEmit + npm test + npm run build (v4.1 §8)"
  foer_deploy:
    - CI grønn
    - tester grønne
    - ingen secrets lekket
    - migrasjoner dokumentert
    - prod-verifisering utført

rapportering:
  format: "Status: ✅ Ferdig / ⚠️ Blokkert / ❌ Feil · Bevis: Commit / Linear / Tester / CI / Prod (v4.1 §18)"

produksjon:
  sannhet: prod
  verifiser:
    api: "fetch mot prod"
    database: "query-verifisering"
    frontend: "browser-verifisering (Playwright/browserbase)"

incident:
  format: [Problem, Rotårsak, Løsning, Test, Forebygging]

alerting:
  kjede: "System → postLinearAlert() → Linear Incident → Hermes → Fix → Evidence"
  krav: [idempotens, fingerprint, audit-logg, ingen spam]
  regel: "ingen nye parallelle alert-systemer (v4.1 §11)"

selvforbedring:
  hermes_vedlikeholder:
    - .hermes/learning-log.md
    - .hermes/decisions.md
    - .hermes/architecture-history.md
    - .blyt/audit-log.md

release_policy:
  direct_main_push:
    allowed: false
  merge_requires:
    - linear_issue
    - tests_passed
    - ci_passed
    - security_check_passed
  production_changes:
    require_tom_approval: true

secret_policy:
  forbidden_locations:
    - repository
    - markdown
    - agent_prompts
  allowed:
    - secret_registry
    - runtime_environment
  scanning:
    required: true
  rotation:
    documented: true
