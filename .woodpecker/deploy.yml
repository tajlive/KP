# Woodpecker CI — Deploy
# Bygger appen og trigger deploy til Coolify.

when:
  - event: push
    branch: main

steps:
  - name: checkout
    image: woodpeckerci/plugin-git
    settings:
      depth: 50

  - name: install
    image: node:24
    commands:
      - npm ci --prefer-offline --legacy-peer-deps

  - name: build
    image: node:24
    commands:
      - npm run build
    environment:
      SKIP_LINT_IN_BUILD: "true"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL}"
      NEXT_PUBLIC_APP_VERSION: "${NEXT_PUBLIC_APP_VERSION}"
      NEXT_PUBLIC_SUPABASE_URL: "${NEXT_PUBLIC_SUPABASE_URL}"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"
      NEXT_PUBLIC_SANITY_PROJECT_ID: "${NEXT_PUBLIC_SANITY_PROJECT_ID}"
      NEXT_PUBLIC_SANITY_DATASET: "${NEXT_PUBLIC_SANITY_DATASET}"
      NEXT_PUBLIC_SANITY_API_VERSION: "${NEXT_PUBLIC_SANITY_API_VERSION}"
      NEXT_PUBLIC_GLITCHTIP_DSN: "${NEXT_PUBLIC_GLITCHTIP_DSN}"
      NEXT_TELEMETRY_DISABLED: "1"

  - name: deploy-to-coolify
    image: alpine/curl
    commands:
      - |
        set -eu
        : "${COOLIFY_DEPLOY_WEBHOOK:?Missing Woodpecker secret: coolify_deploy_webhook}"
        : "${COOLIFY_TOKEN:?Missing Woodpecker secret: coolify_token}"
        echo "Triggering Coolify deploy for ${CI_COMMIT_SHA}..."
        curl \
          --fail-with-body \
          --show-error \
          --silent \
          --max-time 30 \
          --retry 2 \
          --request POST \
          --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
          "${COOLIFY_DEPLOY_WEBHOOK}"
        echo
        echo "Coolify accepted the deploy request."
    secrets:
      - coolify_deploy_webhook
      - coolify_token

  - name: health-check
    image: alpine/curl
    commands:
      - |
        set -eu
        : "${NEXT_PUBLIC_APP_URL:?Missing Woodpecker secret: next_public_app_url}"
        expected_commit="$(printf '%s' "${CI_COMMIT_SHA}" | cut -c1-7)"
        health_url="${NEXT_PUBLIC_APP_URL%/}/api/health"
        echo "Waiting for production commit ${expected_commit}..."

        for i in $(seq 1 60); do
          response="$(curl --fail --show-error --silent --max-time 15 \
            -H 'Cache-Control: no-cache' \
            "${health_url}?deploy=${expected_commit}&attempt=${i}" || true)"

          if printf '%s' "${response}" | grep -Eq \
            "\"status\":\"(healthy|degraded)\".*\"version\":\"${expected_commit}\""; then
            echo "Production is running ${expected_commit} after ${i} attempt(s)."
            exit 0
          fi

          current_version="$(printf '%s' "${response}" \
            | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')"
          echo "Attempt ${i}/60 — current version: ${current_version:-unavailable}"
          sleep 10
        done

        echo "Production did not expose expected commit ${expected_commit} within 10 minutes."
        exit 1
    environment:
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL}"
    when:
      - status: success
