# Secret Registry (v2) — Arch Secret Governance (Master Prompt v4.1 §5, KLA-276)
#
# FORMAT-KONTRAKT: KUN flat struktur — én liste med `- uri:`-blokker og
# skalare `key: value`-felt. scripts/arch/secret-resolve.mjs har en minimal
# parser som håndterer kun dette subsettet. INGEN nestede lister her.
#
# REGEL: INGEN verdier i denne filen. `store` sier hvor verdien faktisk bor.
# Ordning: secret://<prosjekt>/<miljø>/<tjeneste>/<nøkkel> (global = delt på tvers)
entries:
  - uri: secret://global/github/token
    store: hermes-dotenv
    key_name: GITHUB_PERSONAL_ACCESS_TOKEN
    path: ~/.hermes/.env (chmod 600)
    consumers: hermes-github-mcp
    status: active
    note: migrert 2026-08-12 fra config.yaml (KLA-276 Fase 4) — config bruker ${env:GITHUB_PERSONAL_ACCESS_TOKEN}
  - uri: secret://global/supabase/mcp_pat
    store: hermes-dotenv
    key_name: SUPABASE_MCP_PAT
    path: ~/.hermes/.env (chmod 600)
    consumers: hermes-supabase-mcp (remote mcp.supabase.com)
    status: active
    note: migrert 2026-08-12 fra config.yaml (KLA-276 Fase 4) — header bruker Bearer ${env:SUPABASE_MCP_PAT}
  - uri: secret://klarpakke/local/linear/api_key
    store: env.local
    key_name: LINEAR_API_KEY
    path: .env.local
    consumers: hermes-linear-mcp, sentry-webhook, cron-agenter
    status: active
  - uri: secret://klarpakke/prod/linear/api_key
    store: wrangler
    key_name: LINEAR_API_KEY
    path: worker klarpakke (Cloudflare secrets)
    consumers: sentry-webhook prod
    status: planned
    note: settes FØR push av Linear-alert-kjeden — ellers fail-safe no-op i prod
  - uri: secret://klarpakke/prod/okx/api_credentials
    store: bws
    key_name: OKX api-key/secret/passphrase
    path: Bitwarden Secrets (BWS CLI)
    consumers: okx-trading (eea.okx.com)
    status: active
  - uri: secret://klarpakke/prod/cloudflare/api_token
    store: gh
    key_name: CLOUDFLARE_API_TOKEN
    path: GitHub Actions secret (tajlive/KP)
    consumers: ci-deploy, auto-rollback
    status: active
  - uri: secret://klarpakke/local/cloudflare/api_token
    store: env.local
    key_name: CLOUDFLARE_API_TOKEN
    path: .env.local
    consumers: wrangler deploy lokalt
    status: active
  - uri: secret://klarpakke/prod/sentry/webhook_secret
    store: wrangler
    key_name: SENTRY_WEBHOOK_SECRET
    path: worker klarpakke (Cloudflare secrets)
    consumers: sentry-webhook signaturverifisering
    status: active
  - uri: secret://klarpakke/prod/cron/secret
    store: wrangler
    key_name: CRON_SECRET
    path: worker klarpakke (Cloudflare secrets) + pg_cron SQL
    consumers: kill-switch, cron-endepunkter
    status: active
    note: pg_cron-kopi hardkodes i SQL — ved rotasjon må jobben gjenskapes
  - uri: secret://klarpakke/prod/exchange/encryption
    store: wrangler
    key_name: EXCHANGE_ENCRYPTION_SECRET
    path: worker klarpakke (Cloudflare secrets)
    consumers: kryptering av exchange-nøkler i DB
    status: active
    note: ulik lokal ENCRYPTION_KEY — dobbeltsjekk ved rotasjon
  - uri: secret://klarpakke/local/hermes/kimi_oauth
    store: env.local
    key_name: KIMI_OAUTH_TOKEN
    path: .env.local (fornyes av cron hvert 5. min)
    consumers: kimi-oauth-proxy (launchd)
    status: active
  - uri: secret://klarpakke/local/hermes/honcho
    store: env.local
    key_name: HONCHO_API_KEY
    path: .env.local + ~/.hermes/honcho.json (refresh-token)
    consumers: honcho-memory, honcho-key-refresh-cron
    status: active
  - uri: secret://klarpakke/prod/supabase/service_role
    store: wrangler
    key_name: SUPABASE_SERVICE_ROLE_KEY
    path: worker klarpakke (Cloudflare secrets)
    consumers: server-ruter i prod
    status: active
  - uri: secret://klarpakke/local/trello/legacy
    store: env.local
    key_name: TRELLO_KEY, TRELLO_TOKEN
    path: .env.local
    consumers: ingen (utfaset fra kode)
    status: deprecated
    note: arkivert 2026-08-12 (KLA-279) — ingen aktive konsumenter; beholdes kun for evt. Trello-arkivering
