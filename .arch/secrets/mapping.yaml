# Secret Registry — mapping (KLA-276 Fase 2)
# Service → secret://-konvensjon + store-precedens. Ingen verdier.

services:
  linear: secret://klarpakke/<miljø>/linear/api_key
  github: secret://global/github/token
  supabase_mcp: secret://global/supabase/mcp_pat
  supabase_service: secret://klarpakke/<miljø>/supabase/service_role
  cloudflare: secret://klarpakke/<miljø>/cloudflare/api_token
  okx: secret://klarpakke/prod/okx/api_credentials
  sentry: secret://klarpakke/prod/sentry/webhook_secret
  cron: secret://klarpakke/prod/cron/secret
  honcho: secret://klarpakke/local/hermes/honcho
  kimi: secret://klarpakke/local/hermes/kimi_oauth

store_precedence:
  runtime: [wrangler, bws, hermes-dotenv]
  ci: [gh, env.local]
  agent: [hermes-dotenv, env.local]

# Hermes-config refererer secrets via ${env:VAR} — verdiene lastes fra
# ~/.hermes/.env av load_hermes_dotenv() (verifisert i hermes_cli/env_loader.py).
# Eksempler:
#   mcp github:   env: { GITHUB_PERSONAL_ACCESS_TOKEN: "${env:GITHUB_PERSONAL_ACCESS_TOKEN}" }
#   mcp supabase: headers: { Authorization: "Bearer ${env:SUPABASE_MCP_PAT}" }
