name: ✨ Feature Request
description: Foreslå en ny feature for Klarpakke
title: "[FEATURE] "
labels: ["enhancement", "needs-triage"]

body:
  - type: markdown
    attributes:
      value: |
        Foreslå en ny feature for Klarpakke! 💡

  - type: dropdown
    id: area
    attributes:
      label: Område
      options:
        - Paper Trading
        - Auto-Trading
        - AI Features
        - Dashboard/UI
        - Kursinnhold
        - MCP Server
        - Annet
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Feature-beskrivelse
      placeholder: Jeg vil ha...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem det løser
      placeholder: Dette ville hjelpe fordi...
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Hvor viktig er dette for deg?
      options:
        - Nice to have
        - Would be useful
        - Critical need
    validations:
      required: true
