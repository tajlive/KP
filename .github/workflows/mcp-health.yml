# SIST OPPDATERT: 2026-03-27 - Node 24 standardisering
name: 🔌 MCP Health Check

on:
  schedule:
    # Kjør kl 07:00 norsk tid (06:00 UTC) hver hverdag
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

concurrency:
  group: mcp-health
  cancel-in-progress: true

# Node 24 opt-in for JS actions — deprecation 2026
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mcp-health:
    name: Sjekk MCP-tilkoblinger
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: MCP config (.cursor ↔ .mcp)
        run: node scripts/validate-mcp-config.mjs

      - name: Sjekk cloud readiness (deploy)
        run: node scripts/cloud-readiness.mjs --profile deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}

      - name: Sjekk cloud readiness (manual deploy production)
        run: node scripts/cloud-readiness.mjs --profile manual-deploy --environment production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Sjekk Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          STATUS=$(curl -sf \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/" | jq -r '.info.title // "feil"')
          if [[ "$STATUS" == *"PostgREST"* ]] || [[ "$STATUS" != "feil" ]]; then
            echo "✅ Supabase REST: OK"
          else
            echo "❌ Supabase REST: FEIL" && exit 1
          fi
        continue-on-error: true

      - name: Sjekk Stripe
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          OBJ=$(curl -sf https://api.stripe.com/v1/account \
            -u "$STRIPE_SECRET_KEY:" | jq -r .object)
          [[ "$OBJ" == "account" ]] && echo "✅ Stripe: OK" || (echo "❌ Stripe: FEIL" && exit 1)
        continue-on-error: true

      - name: Sjekk Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          COUNT=$(curl -sf "https://api.vercel.com/v9/projects" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | jq '.projects | length')
          [[ "$COUNT" -gt 0 ]] && echo "✅ Vercel: OK ($COUNT prosjekter)" || (echo "❌ Vercel: FEIL" && exit 1)
        continue-on-error: true

      - name: Sjekk Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          TYPE=$(curl -sf "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" | jq -r '.data | type')
          [[ "$TYPE" == "array" ]] && echo "✅ Resend: OK" || (echo "❌ Resend: FEIL" && exit 1)
        continue-on-error: true

      - name: Sjekk Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "⏭️ Cloudflare: hoppet over (CLOUDFLARE_API_TOKEN ikke satt)"
          else
            TITLE=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/user" | jq -r '.result.email // "feil"')
            [[ "$TITLE" != "feil" && -n "$TITLE" ]] && echo "✅ Cloudflare: OK ($TITLE)" || (echo "❌ Cloudflare: FEIL" && exit 1)
          fi
        continue-on-error: true

      - name: Sjekk MCP Edge Function
        env:
          KLARPAKKE_MCP_TOKEN: ${{ secrets.KLARPAKKE_MCP_TOKEN }}
        run: |
          if [[ -z "$KLARPAKKE_MCP_TOKEN" ]]; then
            echo "⏭️ MCP Edge Function: hoppet over (KLARPAKKE_MCP_TOKEN ikke satt)"
          else
            ./scripts/mcp-health.sh | tee mcp-health-result.json
          fi
        continue-on-error: true

      - name: Post til Linear (KLA-251)
        if: always()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          if [[ -z "$LINEAR_API_KEY" ]]; then
            echo "⏭️ Linear: hoppet over (LINEAR_API_KEY ikke satt)"
          else
            BODY="MCP Health Check — $(date '+%Y-%m-%d %H:%M')\\n\\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d "{\"query\":\"mutation { commentCreate(input: { issueId: \\\"6e75fa33-44c8-403b-8ffc-a2db7d26601f\\\", body: \\\"$BODY\\\" }) { success } }\"}" | jq .
          fi
        continue-on-error: true

      - name: Rapport
        if: always()
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "  MCP Health Check — $(date '+%Y-%m-%d %H:%M')"
          echo "════════════════════════════════════════"
          echo "  Se Actions-fanen for detaljer:"
          echo "  https://github.com/tajlive/KP/actions"
