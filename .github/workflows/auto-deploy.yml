name: Auto-Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: auto-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 10
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci

      - name: Build
        run: npm run cf:build

      - name: Deploy
        if: success()
        run: npx wrangler deploy --env ""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify
        run: bash scripts/post-deploy-verify.sh
