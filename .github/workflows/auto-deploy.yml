name: Auto-Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: auto-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-secrets:
    timeout-minutes: 2
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        run: |
          echo "Checking secrets..."
          if [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ]; then echo "NEXT_PUBLIC_SUPABASE_URL missing" && exit 1; fi
          if [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ]; then echo "NEXT_PUBLIC_SUPABASE_ANON_KEY missing" && exit 1; fi
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then echo "CLOUDFLARE_API_TOKEN missing" && exit 1; fi
          echo "All secrets OK"

  deploy:
    needs: check-secrets
    timeout-minutes: 15
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci

      - name: Build
        run: npm run cf:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Deploy
        if: success()
        run: npx wrangler deploy --env ""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify
        run: |
          bash scripts/post-deploy-verify.sh
          echo "=== Sjekk Supabase-feil ==="
          curl -s https://www.klarpakke.no/no/login | grep -c "Supabase er ikke" && {
            echo "❌ Supabase-feil FUNNET!"
            exit 1
          } || echo "✅ 0 Supabase-feil"
