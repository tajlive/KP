name: Enterprise Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

# Cancel in-progress runs for same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # JOB 1: Lint and Build
  # ============================================
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: i18n audit
        run: node scripts/i18n-audit.cjs

      - name: Build application
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/
          retention-days: 1

  # ============================================
  # JOB 2: Smoke Tests (Blocking)
  # ============================================
  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Run smoke tests
        env:
          BASE_URL: ${{ vars.PREVIEW_URL || 'https://www.klarpakke.no' }}
        run: npm run test:e2e:smoke
      
      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # ============================================
  # JOB 3: Critical Tests (Blocking)
  # ============================================
  e2e-critical:
    name: E2E Critical Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-build, e2e-smoke]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
      
      - name: Run critical tests
        env:
          BASE_URL: ${{ vars.PREVIEW_URL || 'https://www.klarpakke.no' }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: npm run test:e2e:critical
      
      - name: Generate Allure report
        if: always()
        run: npm run allure:generate
      
      - name: Upload critical test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-test-results
          path: |
            test-results/
            playwright-report/
            allure-report/
            allure-results/
          retention-days: 14

  # ============================================
  # JOB 4: Lighthouse Preview (Blocking)
  # ============================================
  lighthouse-preview:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-build, e2e-smoke]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Lighthouse CI
        env:
          PREVIEW_URL: ${{ vars.PREVIEW_URL || 'https://www.klarpakke.no' }}
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: |
          echo "Running Lighthouse against $PREVIEW_URL"
          npx lhci autorun --collect.url=$PREVIEW_URL --collect.url=$PREVIEW_URL/innlogging --collect.url=$PREVIEW_URL/dashboard
      
      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 14

  # ============================================
  # JOB 5: Regression Tests (Non-blocking)
  # ============================================
  e2e-regression:
    name: E2E Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [e2e-critical, lighthouse-preview]
    continue-on-error: true  # Non-blocking initially
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Run regression tests
        env:
          BASE_URL: ${{ vars.PREVIEW_URL || 'https://www.klarpakke.no' }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: npm run test:e2e:regression
      
      - name: Upload regression test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # ============================================
  # JOB 6: Mobile Tests (Non-blocking)
  # ============================================
  e2e-mobile:
    name: E2E Mobile Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [e2e-critical]
    continue-on-error: true  # Non-blocking
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps webkit chromium
      
      - name: Run mobile tests
        env:
          BASE_URL: ${{ vars.PREVIEW_URL || 'https://www.klarpakke.no' }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: npm run test:e2e:mobile
      
      - name: Upload mobile test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # ============================================
  # JOB 7: Report Summary
  # ============================================
  report-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [e2e-smoke, e2e-critical, lighthouse-preview, e2e-regression, e2e-mobile]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## 🧪 Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke | ${{ needs.e2e-smoke.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Critical | ${{ needs.e2e-critical.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lighthouse | ${{ needs.lighthouse-preview.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Regression | ${{ needs.e2e-regression.result == 'success' && '✅ PASS' || needs.e2e-regression.result == 'skipped' && '⏭️ SKIP' || '⚠️ WARN' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Mobile | ${{ needs.e2e-mobile.result == 'success' && '✅ PASS' || needs.e2e-mobile.result == 'skipped' && '⏭️ SKIP' || '⚠️ WARN' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Smoke results: smoke-test-results" >> $GITHUB_STEP_SUMMARY
          echo "- Critical results: critical-test-results" >> $GITHUB_STEP_SUMMARY
          echo "- Lighthouse results: lighthouse-results" >> $GITHUB_STEP_SUMMARY
          echo "- Regression results: regression-test-results" >> $GITHUB_STEP_SUMMARY
          echo "- Mobile results: mobile-test-results" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # JOB 8: Deploy Preview (PR only)
  # ============================================
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [e2e-smoke, e2e-critical, lighthouse-preview]
    if: github.event_name == 'pull_request' && !failure()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Vercel
        run: vercel deploy --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ============================================
  # JOB 9: Deploy Production (main only)
  # ============================================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [e2e-smoke, e2e-critical, lighthouse-preview]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !failure()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Vercel Production
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      
      - name: Purge Cloudflare cache
        if: success()
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
