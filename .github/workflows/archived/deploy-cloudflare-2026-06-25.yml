name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
      NEXT_PUBLIC_SANITY_API_VERSION: ${{ vars.NEXT_PUBLIC_SANITY_API_VERSION }}
      NEXT_PUBLIC_GLITCHTIP_DSN: ${{ vars.NEXT_PUBLIC_GLITCHTIP_DSN }}
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --legacy-peer-deps

      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:unit

      - name: Build for Cloudflare Workers
        run: npm run cf:build

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --minify --var APP_VERSION:${{ github.sha }}

      - name: Wait for production health check
        uses: actions/github-script@v7
        with:
          script: |
            const expected = context.sha.substring(0, 7);
            const healthUrl = 'https://www.klarpakke.no/api/health';
            const maxAttempts = 30;
            const delayMs = 10000;

            for (let i = 1; i <= maxAttempts; i++) {
              try {
                const response = await fetch(`${healthUrl}?deploy=${expected}&attempt=${i}`, {
                  headers: { 'Cache-Control': 'no-cache' },
                });
                const data = await response.json().catch(() => ({}));

                if (['healthy', 'degraded'].includes(data.status) && data.version === expected) {
                  core.info(`Production is running ${expected} after ${i} attempt(s).`);
                  return;
                }

                core.info(`Attempt ${i}/${maxAttempts} — current version: ${data.version ?? 'unavailable'}`);
              } catch (error) {
                core.info(`Attempt ${i}/${maxAttempts} — health endpoint unavailable: ${error.message}`);
              }

              if (i < maxAttempts) {
                await new Promise(resolve => setTimeout(resolve, delayMs));
              }
            }

            throw new Error(`Production did not expose expected commit ${expected} within ${maxAttempts * delayMs / 1000} seconds.`);
