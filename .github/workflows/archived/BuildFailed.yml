# ═══════════════════════════════════════════════════════════════════════════════
# WORKAROUND: Suppress phantom deleted workflow
# ═══════════════════════════════════════════════════════════════════════════════
# GitHub had a deleted workflow with path "BuildFailed" that kept generating
# startup_failure runs. This empty workflow file reconciles that state.
# See: https://github.com/tajlive/KP/actions/workflows/260912064
# ═══════════════════════════════════════════════════════════════════════════════

name: BuildFailed

on:
  workflow_dispatch:

concurrency:
  group: build-failed-suppressor
  cancel-in-progress: true

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Phantom workflow suppressed."
