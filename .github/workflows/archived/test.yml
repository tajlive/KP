# ═══════════════════════════════════════════════════════════════════════════════
# TEST WORKFLOW — Konsolidert testing
# ═══════════════════════════════════════════════════════════════════════════════
# Kombinerer: e2e-critical, nightly-regression, test-optimized
#
# Triggers:
#   - push: Til main (smoke + critical)
#   - pull_request: Til main (smoke + critical)
#   - schedule: Nattlig (full regression)
#   - workflow_dispatch: Manuell (velg type)
# ═══════════════════════════════════════════════════════════════════════════════

name: 🧪 Test

on:
  # E2E-tester kjører på PR, push til main, og nattlig schedule.
  # Deploy avhenger av at pr-check er grønn; E2E gir ekstra sikkerhet.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0'  # Søndag kl 03:00 UTC
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type'
        required: true
        default: 'critical'
        type: choice
        options:
          - smoke
          - critical
          - regression
          - full

concurrency:
  group: test-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.14.1"
  NPM_CONFIG_LEGACY_PEER_DEPS: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Test API key for Sonar client tests
  PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY || '' }}

jobs:
  # ═══════════════════════════════════════════════════════════════
  # UNIT TESTS — Raske parallelle tester
  # ═══════════════════════════════════════════════════════════════
  unit:
    name: ⚡ Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    strategy:
      matrix:
        shard: ${{ github.event_name == 'schedule' && fromJson('[1, 2, 3, 4]') || fromJson('[1, 2]') }}
    
    steps:
      - uses: actions/checkout@v5
      
      - name: 🏗️ Setup Environment
        uses: ./.github/actions/setup-klarpakke
      
      - name: ⚡ Run Unit Tests (Shard ${{ matrix.shard }}/${{ github.event_name == 'schedule' && 4 || 2 }})
        run: npm run test:unit -- --shard=${{ matrix.shard }}/${{ github.event_name == 'schedule' && 4 || 2 }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # ═══════════════════════════════════════════════════════════════
  # SMOKE TESTS — Kritiske stier, raske
  # ═══════════════════════════════════════════════════════════════
  smoke:
    name: 🔥 Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit
    
    steps:
      - uses: actions/checkout@v5
      
      - name: 🏗️ Setup Environment
        uses: ./.github/actions/setup-klarpakke
      
      - name: 🎭 Install Playwright
        run: npx playwright install chromium
      
      - name: 🏗️ Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SKIP_LINT_IN_BUILD: "true"
      
      - name: 🚀 Start Server
        run: |
          npm start &
          npx wait-on http://localhost:3000 --timeout 120000
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      
      - name: 🔥 Run Smoke Tests
        run: npm run test:e2e:smoke
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000

  # ═══════════════════════════════════════════════════════════════
  # CRITICAL TESTS — Kjernejourney
  # ═══════════════════════════════════════════════════════════════
  critical:
    name: 🎯 Critical E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: smoke
    if: github.event.inputs.test_type == 'critical' || github.event.inputs.test_type == 'full' || github.event_name == 'pull_request'
    
    strategy:
      matrix:
        shard: [1, 2]
    
    steps:
      - uses: actions/checkout@v5
      
      - name: 🏗️ Setup Environment
        uses: ./.github/actions/setup-klarpakke
      
      - name: 🎭 Install Playwright
        run: npx playwright install chromium
      
      - name: 🏗️ Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SKIP_LINT_IN_BUILD: "true"
      
      - name: 👤 Provision Test Users
        run: npm run test:e2e:provision:env
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      
      - name: 🚀 Start Server
        run: |
          npm start &
          npx wait-on http://localhost:3000 --timeout 120000
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      
      - name: 🎯 Run Critical Tests
        run: npm run test:e2e:critical -- --shard=${{ matrix.shard }}/2
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          KLARPAKKE_E2E_FROM_PROVISION: "1"

  # ═══════════════════════════════════════════════════════════════
  # MOBILE TESTS — Mobil-spesifikk E2E (iPhone 13, Pixel 5)
  # ═══════════════════════════════════════════════════════════════
  mobile:
    name: 📱 Mobile E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: smoke
    if: github.event_name == 'pull_request' || github.event.inputs.test_type == 'full' || github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v5
      
      - name: 🏗️ Setup Environment
        uses: ./.github/actions/setup-klarpakke
      
      - name: 🎭 Install Playwright
        run: npx playwright install chromium
      
      - name: 🏗️ Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SKIP_LINT_IN_BUILD: "true"
      
      - name: 👤 Provision Test Users
        run: npm run test:e2e:provision:env
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      
      - name: 🚀 Start Server
        run: |
          npm start &
          npx wait-on http://localhost:3000 --timeout 120000
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      
      - name: 📱 Run Mobile Tests
        run: npm run test:e2e:mobile
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          KLARPAKKE_E2E_FROM_PROVISION: "1"

  # ═══════════════════════════════════════════════════════════════
  # REGRESSION TESTS — Full test-suite (kun nattlig/manuell)
  # ═══════════════════════════════════════════════════════════════
  regression:
    name: 📊 Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: critical
    if: github.event_name == 'schedule' || github.event.inputs.test_type == 'regression' || github.event.inputs.test_type == 'full'
    
    steps:
      - uses: actions/checkout@v5
      
      - name: 🏗️ Setup Environment
        uses: ./.github/actions/setup-klarpakke
      
      - name: 🎭 Install Playwright
        run: npx playwright install chromium firefox webkit
      
      - name: 🏗️ Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SKIP_LINT_IN_BUILD: "true"
      
      - name: 👤 Provision Test Users
        run: npm run test:e2e:provision:env
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      
      - name: 🚀 Start Server
        run: |
          npm start &
          npx wait-on http://localhost:3000 --timeout 120000
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      
      - name: 📊 Run Regression Tests
        run: npm run test:e2e:regression
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          KLARPAKKE_E2E_FROM_PROVISION: "1"
