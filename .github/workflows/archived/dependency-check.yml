# ═══════════════════════════════════════════════════════════════════════════════
# DEPENDENCY CHECK — Ukentlig automatisk vedlikehold
# ═══════════════════════════════════════════════════════════════════════════════
# - Sjekker utdaterte pakker og sårbarheter
# - Oppretter auto-PR for minor/patch oppdateringer som passerer tester
# - Oppretter issue ved major-oppdateringer eller kritiske sårbarheter
#
# Triggers:
#   - schedule: Hver mandag 07:00 CET
#   - workflow_dispatch: Manuell
# ═══════════════════════════════════════════════════════════════════════════════

name: 📦 Dependency Check

on:
  schedule:
    - cron: '0 6 * * 1'  # Mandag 06:00 UTC = 07:00/08:00 CET
  workflow_dispatch:

concurrency:
  group: dependency-check
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: 🔍 Analyze Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      outdated_count: ${{ steps.report.outputs.outdated_count }}
      major_count: ${{ steps.report.outputs.major_count }}
      critical_count: ${{ steps.report.outputs.critical_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --legacy-peer-deps

      - name: Generate Dependency Report
        id: report
        run: |
          node scripts/dependency-report.mjs
          # Parse counts for outputs
          OUTDATED=$(node -e "const {generateDependencyReport}=await import('./scripts/dependency-report.mjs');const r=generateDependencyReport();console.log(r.outdated.count)")
          MAJOR=$(node -e "const {generateDependencyReport}=await import('./scripts/dependency-report.mjs');const r=generateDependencyReport();console.log(r.outdated.major)")
          CRITICAL=$(node -e "const {generateDependencyReport}=await import('./scripts/dependency-report.mjs');const r=generateDependencyReport();console.log(r.audit.critical)")
          echo "outdated_count=$OUTDATED" >> $GITHUB_OUTPUT
          echo "major_count=$MAJOR" >> $GITHUB_OUTPUT
          echo "critical_count=$CRITICAL" >> $GITHUB_OUTPUT

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: .kimi/ai-health-reports/dependencies-*.md
          retention-days: 30

  auto-update:
    name: 🔄 Auto-Update Minor/Patch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: analyze
    # Kun hvis det finnes utdaterte pakker og ingen kritiske sårbarheter
    if: needs.analyze.outputs.outdated_count > 0 && needs.analyze.outputs.critical_count == 0
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --legacy-peer-deps

      - name: Update minor/patch dependencies
        run: |
          # Update only non-major versions (safe updates)
          npx npm-check-updates --target minor --upgrade
          npm install

      - name: Run type check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:unit

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: deps/auto-update-${{ github.run_id }}
          title: '📦 Auto-update minor/patch dependencies'
          body: |
            🤖 Automatisk dependency-oppdatering generert av `dependency-check.yml`

            - Kun minor og patch-oppdateringer
            - Type-check: ✅
            - Unit-tester: ✅

            **Vennligst review før merge.**
          labels: dependencies, automated
          delete-branch: true

  notify:
    name: 🚨 Notify on Major/Critical
    runs-on: ubuntu-latest
    needs: analyze
    if: needs.analyze.outputs.major_count > 0 || needs.analyze.outputs.critical_count > 0
    permissions:
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create Issue
        uses: actions/github-script@v7
        with:
          script: |
            const major = ${{ needs.analyze.outputs.major_count }};
            const critical = ${{ needs.analyze.outputs.critical_count }};
            const title = `📦 Dependency Alert — ${new Date().toISOString().slice(0, 10)}`;
            const body = `🤖 Automatisk dependency-sjekk fant problemer:

            ${critical > 0 ? `\n🚨 **${critical} kritiske sårbarheter** — kjør \`npm audit fix\` eller security-agent` : ''}
            ${major > 0 ? `\n🔴 **${major} major-oppdateringer** — krever manuell review og testing` : ''}

            Se full rapport i workflow-artifacts: \`dependency-report\`

            ---
            Workflow: \`.github/workflows/dependency-check.yml\`
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['dependencies', 'automated', critical > 0 ? 'security' : '']
                .filter(Boolean)
            });
