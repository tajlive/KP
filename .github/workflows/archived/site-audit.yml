name: Site Audit

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'messages/**'
      - 'scripts/site-audit.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'messages/**'
      - 'scripts/site-audit.mjs'
  schedule:
    # Run nightly at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    name: Codebase Health Check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run site audit (fail-only)
        run: node scripts/site-audit.mjs --fail-only
        id: audit

      - name: Run site audit (full — for report)
        if: always()
        run: node scripts/site-audit.mjs --json > audit-report.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.json
          retention-days: 30

      - name: Comment PR with audit results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('audit-report.json', 'utf-8'));
            } catch {
              return;
            }

            const routes = report.routes.issues.length;
            const links = report.links.issues.length;
            const contentErrors = report.content.issues.filter(i => i.severity === 'error').length;
            const contentWarnings = report.content.issues.filter(i => i.severity === 'warning').length;
            const i18n = report.i18n.hardcoded.length;
            const mocks = report.mocks.issues.length;

            const total = routes + links + contentErrors + contentWarnings + i18n + mocks;

            let body = `## 🔍 Site Audit Report\n\n`;
            body += `| Check | Status | Count |\n`;
            body += `|-------|--------|-------|\n`;
            body += `| Routing | ${routes === 0 ? '✅' : '⚠️'} | ${routes} issues |\n`;
            body += `| Links | ${links === 0 ? '✅' : '⚠️'} | ${links} broken |\n`;
            body += `| Content Errors | ${contentErrors === 0 ? '✅' : '❌'} | ${contentErrors} |\n`;
            body += `| Content Warnings | ${contentWarnings === 0 ? '✅' : '⚠️'} | ${contentWarnings} |\n`;
            body += `| i18n Gaps | ${i18n === 0 ? '✅' : '⚠️'} | ${i18n} hardcoded |\n`;
            body += `| Mocks | ${mocks === 0 ? '✅' : '⚠️'} | ${mocks} found |\n`;
            body += `\n**Total findings: ${total}**\n`;

            if (total === 0) {
              body += `\n🎉 All checks passed!`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
