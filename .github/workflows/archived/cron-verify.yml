name: Cron Health Check

on:
  schedule:
    # Kjører hver 4. time
    - cron: '0 */4 * * *'
  # Tillat manuell kjøring fra GitHub UI
  workflow_dispatch:

concurrency:
  group: cron-verify
  cancel-in-progress: true

jobs:
  verify:
    name: Verifiser pg_cron-jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Installer avhengigheter
        run: npm ci --prefer-offline --ignore-scripts

      - name: Kjør cron-verifikasjon
        run: node scripts/mcp/verify-crons.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          POSTGRES_URL_NON_POOLING:      ${{ secrets.POSTGRES_URL_NON_POOLING }}

      - name: Varsle ved feil
        if: failure()
        run: |
          echo "::error title=Cron Health FEIL::En eller flere klarpakke pg_cron-jobs er inaktive eller returnerer HTTP 401/500. Sjekk Supabase Dashboard → Database → pg_cron."
          echo "::error::Kjør manuelt: npm run cron:verify"
