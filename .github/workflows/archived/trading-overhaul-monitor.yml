# ═══════════════════════════════════════════════════════════════
# KLARPAKKE — Trading Overhaul 48h Observation Monitor
# Kjører daglig kl 22:00 CEST, sammenligner med baseline, varsler Slack
# Periode: 2026-05-05 22:00 → 2026-05-07 22:00 CEST
# ═══════════════════════════════════════════════════════════════

name: 📊 Trading Overhaul 48h Monitor

on:
  schedule:
    # 22:00 CEST = 20:00 UTC
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      period_hours:
        description: 'Hours to analyze (default: 24)'
        required: false
        default: '24'
      baseline_path:
        description: 'Path to baseline JSON'
        required: false
        default: 'scripts/monitor/baseline.json'

concurrency:
  group: trading-overhaul-monitor
  cancel-in-progress: false

env:
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_OPS_WEBHOOK_URL }}
  LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}

jobs:
  capture-metrics:
    name: Capture Trading Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Capture current metrics
        id: metrics
        run: |
          HOURS="${{ github.event.inputs.period_hours || '24' }}"
          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%S")
          OUTFILE="/tmp/trading-metrics-${TIMESTAMP}.json"

          echo "Capturing last ${HOURS} hours of trading metrics..."
          node scripts/monitor/trading-metrics.mjs "$HOURS" --save="$OUTFILE"

          echo "metrics_file=$OUTFILE" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

          # Extract key values for Slack
          WIN_RATE=$(cat "$OUTFILE" | jq -r '.win_rate')
          MAX_DD=$(cat "$OUTFILE" | jq -r '.max_drawdown_pct')
          SHARPE=$(cat "$OUTFILE" | jq -r '.sharpe_ratio')
          MTF_BLOCK=$(cat "$OUTFILE" | jq -r '.mtf_block_pct')
          P0_ERRORS=$(cat "$OUTFILE" | jq -r '.p0_errors')
          TOTAL_TRADES=$(cat "$OUTFILE" | jq -r '.total_trades')

          echo "win_rate=$WIN_RATE" >> $GITHUB_OUTPUT
          echo "max_dd=$MAX_DD" >> $GITHUB_OUTPUT
          echo "sharpe=$SHARPE" >> $GITHUB_OUTPUT
          echo "mtf_block=$MTF_BLOCK" >> $GITHUB_OUTPUT
          echo "p0_errors=$P0_ERRORS" >> $GITHUB_OUTPUT
          echo "total_trades=$TOTAL_TRADES" >> $GITHUB_OUTPUT

      - name: Compare with baseline
        id: compare
        run: |
          BASELINE="${{ github.event.inputs.baseline_path || 'scripts/monitor/baseline.json' }}"
          METRICS="${{ steps.metrics.outputs.metrics_file }}"

          echo "Comparing with baseline..."
          python3 scripts/monitor/compare-metrics.py "$BASELINE" "$METRICS" || COMPARE_EXIT=$?

          echo "compare_exit=${COMPARE_EXIT:-0}" >> $GITHUB_OUTPUT

          # Determine status
          if [ "${COMPARE_EXIT:-0}" -eq 2 ]; then
            echo "status=critical" >> $GITHUB_OUTPUT
          elif [ "${COMPARE_EXIT:-0}" -eq 1 ]; then
            echo "status=warning" >> $GITHUB_OUTPUT
          else
            echo "status=ok" >> $GITHUB_OUTPUT
          fi

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: trading-metrics-${{ steps.metrics.outputs.timestamp }}
          path: ${{ steps.metrics.outputs.metrics_file }}
          retention-days: 30

      - name: GitHub Actions Summary
        run: |
          echo "## 📊 Trading Overhaul Monitor Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Win Rate | ${{ steps.metrics.outputs.win_rate }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Max Drawdown | ${{ steps.metrics.outputs.max_dd }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| Sharpe Ratio | ${{ steps.metrics.outputs.sharpe }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MTF Block % | ${{ steps.metrics.outputs.mtf_block }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| P0 Errors | ${{ steps.metrics.outputs.p0_errors }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Total Trades | ${{ steps.metrics.outputs.total_trades }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ steps.compare.outputs.status }}" >> $GITHUB_STEP_SUMMARY

      - name: Slack Alert — Critical
        if: steps.compare.outputs.status == 'critical'
        run: |
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d '{
              "channel": "#trading-overhaul",
              "username": "Trading Monitor",
              "icon_emoji": ":rotating_light:",
              "attachments": [
                {
                  "color": "danger",
                  "title": "🚨 48h Observation — CRITICAL ALERT",
                  "text": "Trading metrics FAILED critical thresholds. Manual review required.",
                  "fields": [
                    {"title": "Win Rate", "value": "'"${{ steps.metrics.outputs.win_rate }}"'", "short": true},
                    {"title": "Max DD", "value": "'"${{ steps.metrics.outputs.max_dd }}"'%", "short": true},
                    {"title": "Sharpe", "value": "'"${{ steps.metrics.outputs.sharpe }}"'", "short": true},
                    {"title": "P0 Errors", "value": "'"${{ steps.metrics.outputs.p0_errors }}"'", "short": true},
                    {"title": "Total Trades", "value": "'"${{ steps.metrics.outputs.total_trades }}"'", "short": true},
                    {"title": "MTF Block", "value": "'"${{ steps.metrics.outputs.mtf_block }}"'%", "short": true}
                  ],
                  "footer": "Klarpakke Trading Overhaul Monitor",
                  "ts": '$(date +%s)'
                }
              ]
            }'

      - name: Slack Alert — Warning
        if: steps.compare.outputs.status == 'warning'
        run: |
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d '{
              "channel": "#trading-overhaul",
              "username": "Trading Monitor",
              "icon_emoji": ":warning:",
              "attachments": [
                {
                  "color": "warning",
                  "title": "⚠️ 48h Observation — Warning",
                  "text": "Trading metrics show warnings. Monitor closely.",
                  "fields": [
                    {"title": "Win Rate", "value": "'"${{ steps.metrics.outputs.win_rate }}"'", "short": true},
                    {"title": "Max DD", "value": "'"${{ steps.metrics.outputs.max_dd }}"'%", "short": true},
                    {"title": "Sharpe", "value": "'"${{ steps.metrics.outputs.sharpe }}"'", "short": true},
                    {"title": "P0 Errors", "value": "'"${{ steps.metrics.outputs.p0_errors }}"'", "short": true}
                  ],
                  "footer": "Klarpakke Trading Overhaul Monitor",
                  "ts": '$(date +%s)'
                }
              ]
            }'

      - name: Slack Alert — OK
        if: steps.compare.outputs.status == 'ok'
        run: |
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d '{
              "channel": "#trading-overhaul",
              "username": "Trading Monitor",
              "icon_emoji": ":chart_with_upwards_trend:",
              "attachments": [
                {
                  "color": "good",
                  "title": "✅ 48h Observation — All Clear",
                  "text": "Trading metrics within expected thresholds.",
                  "fields": [
                    {"title": "Win Rate", "value": "'"${{ steps.metrics.outputs.win_rate }}"'", "short": true},
                    {"title": "Max DD", "value": "'"${{ steps.metrics.outputs.max_dd }}"'%", "short": true},
                    {"title": "Sharpe", "value": "'"${{ steps.metrics.outputs.sharpe }}"'", "short": true},
                    {"title": "Total Trades", "value": "'"${{ steps.metrics.outputs.total_trades }}"'", "short": true}
                  ],
                  "footer": "Klarpakke Trading Overhaul Monitor",
                  "ts": '$(date +%s)'
                }
              ]
            }'

  # Final rollout decision (runs only on 2026-05-07 or manual dispatch with --final)
  rollout-decision:
    name: Rollout Decision
    runs-on: ubuntu-latest
    needs: capture-metrics
    if: >
      (github.event.schedule == '0 20 * * *' && contains(github.run_started_at, '2026-05-07'))
      || github.event.inputs.final == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all metrics artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: trading-metrics-*
          merge-multiple: true
          path: ./metrics-history

      - name: Final decision
        run: |
          BASELINE="scripts/monitor/baseline.json"
          LATEST=$(ls -t ./metrics-history/*.json | head -1)

          echo "Running final rollout decision..."
          echo "Baseline: $BASELINE"
          echo "Latest: $LATEST"

          python3 scripts/monitor/rollout-decision.py "$BASELINE" "$LATEST" || DECISION_EXIT=$?

          if [ "${DECISION_EXIT:-0}" -eq 0 ]; then
            echo "## 🎉 ROLLOUT APPROVED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All gates passed. Ready for phased rollout." >> $GITHUB_STEP_SUMMARY
          elif [ "${DECISION_EXIT:-0}" -eq 1 ]; then
            echo "## ⚠️ CONDITIONAL ROLLOUT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Warnings present. Recommend 10% phased rollout with extended monitoring." >> $GITHUB_STEP_SUMMARY
          else
            echo "## 🔴 ROLLOUT BLOCKED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Critical failures detected. Rollout CANCELLED." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Slack — Rollout Decision
        run: |
          DECISION="$(cat $GITHUB_STEP_SUMMARY | grep '^## ' | sed 's/^## //')"
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d '{
              "channel": "#trading-overhaul",
              "username": "Trading Monitor",
              "icon_emoji": ":rocket:",
              "text": "*48h Observation Complete*\n'"$DECISION"'\n\nReview full report in GitHub Actions."
            }'
