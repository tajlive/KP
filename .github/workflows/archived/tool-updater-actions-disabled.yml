# ═══════════════════════════════════════════════════════════════════════════════
# Auto-update: KIMI Code CLI + MemPalace
# ═══════════════════════════════════════════════════════════════════════════════
# Sjekker ukentlig om det finnes nye versjoner av globale verktøy og lager en
# PR med oppdatert .tool-versions. PR-en kjører også en test-oppdatering i
# runneren for å verifisere at installasjonen fungerer.
#
# Lokal installasjon må fortsatt gjøres manuelt (eller via cron/LaunchAgent):
#   bash scripts/update-tools.sh
# ═══════════════════════════════════════════════════════════════════════════════

name: Tool Updater

on:
  schedule:
    - cron: "0 7 * * 1" # Mandag 07:00 UTC / 08:00 sommertid Norge
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: tool-updater
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      outdated: ${{ steps.check.outputs.outdated }}
      details: ${{ steps.check.outputs.details }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Check for tool updates
        id: check
        run: |
          node scripts/check-tool-updates.mjs --json > tool-status.json
          cat tool-status.json
          echo "outdated=$(jq '.hasUpdates' tool-status.json)" >> "$GITHUB_OUTPUT"
          echo "details<<EOF" >> "$GITHUB_OUTPUT"
          cat tool-status.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  update:
    needs: check
    if: needs.check.outputs.outdated == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply tool updates in runner
        run: |
          npm install -g @moonshot-ai/kimi-code@latest
          python3 -m pip install --upgrade mempalace
          node scripts/check-tool-updates.mjs --write

      - name: Verify versions
        run: |
          echo "KIMI Code CLI: $(kimi --version)"
          echo "MemPalace: $(mempalace --version | tail -1)"

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="auto/tool-updates-$(date +%Y%m%d)"
          git checkout -b "$branch"
          git add .tool-versions
          if git diff --cached --quiet; then
            echo "Ingen endringer å committe."
            exit 0
          fi

          git commit -m "chore(tools): bump kimi-code and/or mempalace"

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -u origin "$branch"

          body=$(cat <<'EOF'
          Automatisk verktøyoppdatering.

          ## Hva som er oppdatert
          Se `.tool-versions` for nye versjoner.

          ## Husk lokal installasjon
          Etter merge, kjør:
          ```bash
          bash scripts/update-tools.sh
          ```

          Dette er en automatisk PR fra `.github/workflows/tool-updater.yml`.
          EOF
          )

          gh pr create \
            --title "chore(tools): bump pinned tool versions" \
            --body "$body" \
            --base main \
            --label dependencies,automated
