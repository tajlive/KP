# ═══════════════════════════════════════════════════════════════════════════════
# KNOWLEDGE MINER - Daglig utvinning av prosjektkunnskap
# ═══════════════════════════════════════════════════════════════════════════════
# Bygger en levende kunnskapsbase som MemPalace kan søke i
# ═══════════════════════════════════════════════════════════════════════════════

name: 🧠 Knowledge Miner

on:
  schedule:
    - cron: '0 8 * * *'  # Hver dag kl 08:00 UTC
  workflow_dispatch:
  push:
    paths:
      - 'docs/adr/**'
      - '.knowledge/**'

jobs:
  mine:
    name: ⛏️ Extract Knowledge
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Trenger git-historie
      
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
      
      - name: 🧠 Run Knowledge Miner
        run: node scripts/knowledge-miner.mjs
      
      - name: 📊 Show Stats
        run: |
          echo "📁 Generated knowledge files:"
          find .knowledge -name "*.md" -type f 2>/dev/null | wc -l | xargs echo "   Files:"
          
          echo ""
          echo "📋 TODOs tracked:"
          grep -c "TODO\|FIXME" .knowledge/current-todos.md 2>/dev/null || echo "   0"
      
      - name: 💾 Commit Changes
        run: |
          git config user.name "Knowledge Miner"
          git config user.email "knowledge@klarpakke.bot"
          
          git add .knowledge/
          if git diff --staged --quiet; then
            echo "ℹ️  No new knowledge to commit"
          else
            git commit -m "🧠 Auto: Daily knowledge mining [$(date +%Y-%m-%d)]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
