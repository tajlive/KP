# ============================================================================
# MANUELL DEPLOY - Kun trigges manuelt (sparer GitHub Actions minutter)
# ============================================================================

name: 🚀 Manual Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy til'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

concurrency:
  group: manual-deploy-${{ github.event.inputs.environment || 'preview' }}
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Timeout for å spare minutter
    
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline

      - name: ✅ Validate deploy prerequisites
        run: node scripts/cloud-readiness.mjs --profile manual-deploy --environment "${{ github.event.inputs.environment }}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: 📂 Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.mjs') }}
          restore-keys: next-${{ runner.os }}-

      - name: 🔍 Lint
        run: npm run lint

      # Krever GitHub secrets: SUPABASE_PROJECT_REF, SUPABASE_ACCESS_TOKEN
      - name: 🗄️ Supabase migrasjoner (kun production)
        if: github.event.inputs.environment == 'production'
        run: |
          npx supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          npx supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: 🏗️ Build
        run: npm run build
        env:
          SKIP_LINT_IN_BUILD: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: 🚀 Deploy to Vercel
        run: |
          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            npx vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
          else
            npx vercel deploy --token ${{ secrets.VERCEL_TOKEN }} --yes
          fi
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}

      - name: ✅ Verify production (kun ved production deploy)
        if: github.event.inputs.environment == 'production'
        run: npm run verify
