# Automatisert Testing med MCP
name: MCP Automated Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Kjør hver dag kl 08:00
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  mcp-test-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  mcp-smoke-tests:
    runs-on: ubuntu-latest
    needs: mcp-test-suite
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run Smoke Tests
        run: npm run test:e2e
        env:
          TEST_BASE_URL: ${{ vars.TEST_BASE_URL || 'https://www.klarpakke.no' }}

  mcp-production-health:
    runs-on: ubuntu-latest
    steps:
      - name: Health Check
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://www.klarpakke.no/no || exit 1
          curl -s -o /dev/null -w "%{http_code}" https://www.klarpakke.no/api/health || exit 1

  mcp-i18n-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate i18n
        run: node scripts/validate-i18n.js

  mcp-db-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Check migrations
        run: supabase db lint --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
