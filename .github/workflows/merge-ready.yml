# SIST OPPDATERT: 2026-04-02 - KLA-PROFIT1 Merge Gate
# ============================================================================
# MERGE READY – Blokkerende CI-gate for feat/ai-profit-max
# ============================================================================
# Denne workflowen kjører alle kvalitetssjekker som MÅ passere før merge til main.
# Den er designet for å være deterministisk, rask og pålitelig.
#
# Triggers:
#   - Pull request til main
#   - Push til feat/ai-profit-max
#   - Manuell workflow_dispatch
#
# Kjører:
#   1. TypeScript type-check
#   2. ESLint
#   3. Unit tests (Vitest)
#   4. Build
#   5. E2E tests med warmup (Playwright)
#
# Artifacts:
#   - Playwright report (alltid)
#   - Test results (alltid)
#   - Build logs (ved feil)
#
# Required secrets:
#   - NEXT_PUBLIC_SUPABASE_URL
#   - NEXT_PUBLIC_SUPABASE_ANON_KEY
#   - SUPABASE_SERVICE_ROLE_KEY (for E2E user provisioning)
#   - E2E_USER_EMAIL / E2E_USER_PASSWORD
# ============================================================================

name: 🔒 Merge Ready

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [feat/ai-profit-max]
  workflow_dispatch:

concurrency:
  group: merge-ready-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

# Node 24 opt-in for JS actions — deprecation 2026
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # =============================================================================
  # STEG 1: Type Check
  # =============================================================================
  type-check:
    name: ⌨️ Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline

      - name: ⌨️ TypeScript type check
        run: npm run type-check

  # =============================================================================
  # STEG 2: Lint
  # =============================================================================
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline

      - name: 🔍 ESLint
        run: npm run lint

  # =============================================================================
  # STEG 3: Unit Tests
  # =============================================================================
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline

      - name: 🧪 Vitest unit tests
        run: npm run test:unit

  # =============================================================================
  # STEG 4: Build
  # =============================================================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [type-check, lint]
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline

      - name: 📂 Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.mjs') }}
          restore-keys: next-${{ runner.os }}-

      - name: 🏗️ Next.js build
        run: npm run build
        env:
          SKIP_LINT_IN_BUILD: 'true'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://vuxbjlykgmzskxbclquf.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-ci-build' }}

      - name: 📤 Upload build artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            .next/error.log
            .next/trace
          if-no-files-found: ignore
          retention-days: 3

  # =============================================================================
  # STEG 5: E2E Tests med Warmup
  # =============================================================================
  e2e-tests:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, unit-tests]
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 🖥️ Runtime-verifisering
        run: |
          echo "Node: $(node -v)"
          echo "npm: $(npm -v)"

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline

      - name: 🎭 Install Playwright
        run: npx playwright install --with-deps chromium

      # E2E-bruker provisionering (krever SUPABASE_SERVICE_ROLE_KEY)
      - name: 👤 Provision E2E test user
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://vuxbjlykgmzskxbclquf.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY mangler -- E2E user provisioning hoppes over"
            exit 0
          fi
          if [ -z "$E2E_USER_EMAIL" ] || [ -z "$E2E_USER_PASSWORD" ]; then
            echo "::warning::E2E_USER_EMAIL / E2E_USER_PASSWORD mangler -- E2E user provisioning hoppes over"
            exit 0
          fi
          node scripts/create-test-users.js --from-env

      # Kjør E2E med warmup (global-setup.ts håndterer dev server start)
      - name: 🎭 Run E2E tests with warmup
        run: npm run test:e2e:warmup
        env:
          PLAYWRIGHT_TEST_BASE_URL: 'http://localhost:3001'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://vuxbjlykgmzskxbclquf.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      # Last opp artifacts uavhengig av resultat
      - name: 📤 Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-merge-ready
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: 📤 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-merge-ready
          path: |
            test-results.json
            test-summary.md
          if-no-files-found: ignore
          retention-days: 7

  # =============================================================================
  # SUMMARY – Oppdater PR med status
  # =============================================================================
  summary:
    name: 📋 Summary
    runs-on: ubuntu-latest
    needs: [type-check, lint, unit-tests, build, e2e-tests]
    if: always()
    steps:
      - name: 📋 Build summary
        run: |
          echo "## 🔒 Merge Ready Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # Type Check
          if [ "${{ needs.type-check.result }}" == "success" ]; then
            echo "| ⌨️ Type Check | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ⌨️ Type Check | ❌ Fail |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Lint
          if [ "${{ needs.lint.result }}" == "success" ]; then
            echo "| 🔍 Lint | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🔍 Lint | ❌ Fail |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Unit Tests
          if [ "${{ needs.unit-tests.result }}" == "success" ]; then
            echo "| 🧪 Unit Tests | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🧪 Unit Tests | ❌ Fail |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Build
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "| 🏗️ Build | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🏗️ Build | ❌ Fail |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # E2E Tests
          if [ "${{ needs.e2e-tests.result }}" == "success" ]; then
            echo "| 🎭 E2E Tests | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🎭 E2E Tests | ❌ Fail |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Overall status
          if [ "${{ needs.type-check.result }}" == "success" ] && \
             [ "${{ needs.lint.result }}" == "success" ] && \
             [ "${{ needs.unit-tests.result }}" == "success" ] && \
             [ "${{ needs.build.result }}" == "success" ] && \
             [ "${{ needs.e2e-tests.result }}" == "success" ]; then
            echo "**🎉 All checks passed -- Ready for merge!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "**❌ Some checks failed -- Fix before merge**" >> $GITHUB_STEP_SUMMARY
          fi

      # Kommenter på PR ved suksess
      - name: 💬 PR comment on success
        if: |
          github.event_name == 'pull_request' &&
          needs.type-check.result == 'success' &&
          needs.lint.result == 'success' &&
          needs.unit-tests.result == 'success' &&
          needs.build.result == 'success' &&
          needs.e2e-tests.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- merge-ready-success -->';
            const body = `## ✅ Merge Ready -- All Checks Passed\n${marker}\n\n| Check | Status |\n|-------|--------|\n| ⌨️ Type Check | ✅ |\n| 🔍 Lint | ✅ |\n| 🧪 Unit Tests | ✅ |\n| 🏗️ Build | ✅ |\n| 🎭 E2E Tests | ✅ |\n\n**This PR is ready for merge to main.**`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(c => c.body && c.body.includes(marker) && c.user.type === 'Bot');
            
            if (!botComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # Kommenter på PR ved feil
      - name: 💬 PR comment on failure
        if: |
          github.event_name == 'pull_request' && (
            needs.type-check.result == 'failure' ||
            needs.lint.result == 'failure' ||
            needs.unit-tests.result == 'failure' ||
            needs.build.result == 'failure' ||
            needs.e2e-tests.result == 'failure'
          )
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- merge-ready-failure -->';
            const body = `## ❌ Merge Ready -- Checks Failed\n${marker}\n\n| Check | Status |\n|-------|--------|\n| ⌨️ Type Check | ${{ needs.type-check.result == 'success' ? '✅' : '❌' }} |\n| 🔍 Lint | ${{ needs.lint.result == 'success' ? '✅' : '❌' }} |\n| 🧪 Unit Tests | ${{ needs.unit-tests.result == 'success' ? '✅' : '❌' }} |\n| 🏗️ Build | ${{ needs.build.result == 'success' ? '✅' : '❌' }} |\n| 🎭 E2E Tests | ${{ needs.e2e-tests.result == 'success' ? '✅' : '❌' }} |\n\n**Fix the failing checks before merging.**`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(c => c.body && c.body.includes(marker) && c.user.type === 'Bot');
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
