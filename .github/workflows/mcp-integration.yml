# SIST OPPDATERT: 2026-03-27 - Node 24 standardisering
name: MCP Integration Tests

on:
  push:
    branches: [ main ]
    paths:
      - '.cursor/mcp.json'
      - '.mcp/**'
      - '.kimi/**'
      - 'scripts/mcp*.sh'
      - 'scripts/run-*-mcp.mjs'
      - 'scripts/test-mcp*.sh'
      - 'scripts/verify-automation.sh'
      - 'scripts/validate-mcp-config.mjs'
      - 'scripts/automation-preflight.mjs'
  pull_request:
    branches: [ main ]
    paths:
      - '.cursor/mcp.json'
      - '.mcp/**'
      - '.kimi/**'
      - 'scripts/mcp*.sh'
      - 'scripts/run-*-mcp.mjs'
      - 'scripts/test-mcp*.sh'
      - 'scripts/verify-automation.sh'
      - 'scripts/validate-mcp-config.mjs'
      - 'scripts/automation-preflight.mjs'

concurrency:
  group: mcp-integration-${{ github.ref }}
  cancel-in-progress: true

# Node 24 opt-in for JS actions — deprecation 2026
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mcp-config-validation:
    name: Validate MCP Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Validate MCP config (JSON + .cursor ↔ .mcp ↔ .kimi)
      run: node scripts/validate-mcp-config.mjs

    - name: List MCP servers (Cursor)
      run: |
        echo "📋 MCP Servers:"
        node -e "
          const c = JSON.parse(require('fs').readFileSync('.cursor/mcp.json', 'utf8'));
          Object.keys(c.mcpServers || {}).sort().forEach(s => console.log('  ✅', s));
        "

  mcp-security-check:
    name: MCP Security Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Check for exposed secrets
      run: |
        echo "🔒 Checking for exposed secrets in MCP config..."
        
        # Check for hardcoded tokens (basic check)
        if grep -E "(sk_live|sk_test|lin_api_|sbp_|vcp_|sntryu_)" .cursor/mcp.json .mcp/mcp_config.json .kimi/mcp-config.json 2>/dev/null | grep -v "^\s*//"; then
          echo "⚠️  Warning: Potential hardcoded secrets found in MCP config"
          echo "   Consider using environment variables instead"
        else
          echo "✅ No obvious hardcoded secrets found"
        fi
        
        # Check for proper environment variable usage
        echo ""
        echo "📋 Environment variable usage:"
        grep -o '\${[A-Z_]*}' .cursor/mcp.json .mcp/mcp_config.json .kimi/mcp-config.json 2>/dev/null | sort -u || echo "  No env vars found"

  mcp-readme:
    name: Update MCP Documentation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Generate MCP documentation
      run: |
        cat > MCP-GUIDE.md << 'EOF'
        # 🤖 MCP (Model Context Protocol) Guide
        
        ## Overview
        
        Klarpakke uses MCP to integrate with various services through AI assistants like Cursor and Claude.
        
        ## Configured MCP Servers
        
        | Server | Purpose | Status |
        |--------|---------|--------|
        | **GitHub** | Repository management | ✅ Active |
        | **Linear** | Issue tracking | ✅ Active |
        | **Supabase** | Database operations | ✅ Active |
        | **Vercel** | Deployment | ✅ Active |
        | **Stripe** | Payment handling | ✅ Active |
        | **Sentry** | Error monitoring | ✅ Active |
        | **Playwright** | E2E testing | ✅ Active |
        
        ## Configuration Files
        
        - `.cursor/mcp.json` - Master (Cursor IDE)
        - `.mcp/mcp_config.json` - Synced copy (CI/tools)
        - `.kimi/mcp-config.json` - Synced copy (Kimi CLI); use `npm run mcp:sync`
        
        ## Usage
        
        ### In Cursor
        
        1. Open Command Palette (Cmd+Shift+P)
        2. Type "MCP"
        3. Select available tools
        
        ### Available Tools
        
        - Create Linear issues from code comments
        - Query Supabase database
        - Deploy to Vercel
        - Check Stripe payments
        - Monitor Sentry errors
        - Run Playwright tests
        
        ## Security
        
        All sensitive tokens are stored as environment variables. Never commit tokens directly to the repository.
        
        EOF
        
    - name: Commit documentation
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add MCP-GUIDE.md
        git diff --staged --quiet || git commit -m "docs: Auto-update MCP guide"
        git push
