name: Import Fly.io Secrets

on:
  workflow_dispatch:

concurrency:
  group: fly-secrets-import
  cancel-in-progress: false

jobs:
  import-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Import secrets to Fly.io
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          printf 'POSTGRES_URL=%s\nDATABASE_URL=%s\n' "$POSTGRES_URL" "$DATABASE_URL" | \
            flyctl secrets import --app klarpakke

      - name: Verify health
        shell: bash
        run: |
          echo "Waiting for https://www.klarpakke.no/api/health ..."
          for i in $(seq 1 36); do
            if curl -sfS -o /dev/null --max-time 15 "https://www.klarpakke.no/api/health"; then
              echo "Health OK after ${i} attempt(s)"
              exit 0
            fi
            echo "Attempt $i/36 — sleeping 10s"
            sleep 10
          done
          echo "::error::Health did not become ready in time"
          exit 1
