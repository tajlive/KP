name: Health Monitor

on:
  schedule:
    - cron: '*/15 * * * *'  # Hvert 15. min
  workflow_dispatch:

jobs:
  check:
    runs-on: [self-hosted, macOS]
    defaults:
      run:
        shell: bash
    timeout-minutes: 5
    steps:
      - name: Test all pages
        run: |
          BASE="https://www.klarpakke.no"
          ERRORS=0
          RESULTS=""
          
          check() {
            code=$(curl -s -o /tmp/kp -w "%{http_code}" -m10 "$BASE$1")
            # Kun ekte Worker crashes: Feilkode: 1234567 (7+ siffer), IKKE i18n {code}
            crash=$(grep -cE "Feilkode: [0-9]{7,}" /tmp/kp 2>/dev/null || echo 0)
            is_i18n=$(grep -c "Feilkode: {" /tmp/kp 2>/dev/null || echo 0)
            if [ "$crash" -gt "$is_i18n" ]; then
              RESULTS="${RESULTS}\\n❌ $1 (Worker crash)"
              echo "::warning::Page crash: $BASE$1"
              ERRORS=$((ERRORS+1))
            elif [ "$code" = "200" ]; then
              echo "  ✅ $1"
            elif [ "$code" = "307" ]; then
              echo "  🔐 $1 (auth)"
            else
              RESULTS="${RESULTS}\n⚠️ $1 (HTTP $code)"
              echo "::warning::HTTP $code: $BASE$1"
              ERRORS=$((ERRORS+1))
            fi
          }
          
          echo "🏥 Klarpakke Health — $(date +%H:%M)"
          for page in /no /no/priser /no/login /no/register /no/bots /no/leaderboard /no/om-oss /no/kontakt /no/kalkulator /no/hjelp /no/binance-guide /api/health; do
            check "$page"
          done
          
          echo "RESULTS=$RESULTS" >> $GITHUB_ENV
          echo "ERRORS=$ERRORS" >> $GITHUB_ENV
          
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::$ERRORS page(s) failing!"
            exit 1
          fi
          echo "✅ 12 pages OK"

      - name: Report to Sentry (on failure)
        if: failure()
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "event_id": "${{ github.run_id }}",
            "timestamp": "${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}",
            "platform": "github-actions",
            "level": "error",
            "logger": "health-monitor",
            "transaction": "${{ github.workflow }}",
            "message": {
              "formatted": "Health monitor FAILED — ${{ env.ERRORS }} error(s)"
            },
            "tags": {
              "workflow": "${{ github.workflow }}",
              "run_id": "${{ github.run_id }}",
              "branch": "${{ github.ref_name }}"
            },
            "extra": {
              "failures": "${{ env.RESULTS }}",
              "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
          }
          EOF
          )
          
          curl -s -X POST "https://sentry.io/api/0/organizations/klarpakke-h3/monitors/health-monitor/checkins/" \
            -H "Authorization: DSN https://beff674ffc73a116bacc53a9f15e8c68@o4511701230747648.ingest.de.sentry.io/4511701234483280" \
            -H "Content-Type: application/json" \
            -d "{\"status\": \"error\", \"duration\": $SECONDS}"
          
          # Store event via API
          curl -s -X POST "https://sentry.io/api/0/projects/klarpakke-h3/klarpakke-no/events/" \
            -H "Authorization: Bearer ${{ secrets.SENTRY_AUTH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Sentry OK checkin
        if: success()
        run: |
          curl -s -X POST "https://sentry.io/api/0/organizations/klarpakke-h3/monitors/health-monitor/checkins/" \
            -H "Authorization: DSN https:...3280" \
            -H "Content-Type: application/json" \
            -d "{\"status\": \"ok\", \"duration\": $SECONDS}"

      - name: Slack notification (on failure)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_OPS_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "⚠️  SLACK_OPS_WEBHOOK_URL not set — skipping Slack notification"
            exit 0
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          MESSAGE="*Health Monitor detected $ERRORS error(s)* on *$(date +%Y-%m-%d %H:%M)*\n\`\`\`$RESULTS\`\`\`\nEnvironment: \`${{ github.ref_name }}\`"

          PAYLOAD=$(cat <<PAYLOADEOF
          {
            "attachments": [
              {
                "color": "#d63865",
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": "🚨 Health Monitor: $ERRORS failure(s)",
                      "emoji": true
                    }
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "$MESSAGE"
                    }
                  },
                  {
                    "type": "actions",
                    "elements": [
                      {
                        "type": "button",
                        "text": {
                          "type": "plain_text",
                          "text": "🔍 View Run",
                          "emoji": true
                        },
                        "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                        "style": "danger"
                      }
                    ]
                  },
                  {
                    "type": "context",
                    "elements": [
                      {
                        "type": "mrkdwn",
                        "text": "Repository: <https://github.com/${{ github.repository }}|${{ github.repository }}> | Run: #${{ github.run_id }}"
                      }
                    ]
                  }
                ]
              }
            ]
          }
          PAYLOADEOF
          )

          echo "Sending Slack notification..."
          RESPONSE=$(curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data-raw "$(echo "$PAYLOAD" | python3 -c 'import sys,json; print(json.dumps(json.load(sys.stdin)))')" \
            -w "%{http_code}" \
            -o /dev/null)

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Slack notification sent (HTTP $RESPONSE)"
          else
            echo "⚠️  Slack notification returned HTTP $RESPONSE"
          fi
