name: Deploy to Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  smoke:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "🏥 Pre-deploy smoke — sjekker prod helse før staging deploy..."
          HEALTH=$(curl -s -m 10 "https://www.klarpakke.no/api/health" | jq -r '.status')
          if [ "$HEALTH" != "healthy" ]; then
            echo "❌ PROD er unhealthy — staging deploy blokkert"
            exit 1
          fi
          echo "✅ PROD healthy — fortsetter staging deploy"

  deploy:
    needs: smoke
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      
      # Kjør E2E tester FØR deploy
      - run: |
          npx playwright test --config=playwright.allure.config.ts --project=chromium --grep "health|critical" 2>&1 | tail -10
        continue-on-error: true

      # Deploy til staging  
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --minify --var APP_VERSION:staging-${{ github.sha }}
          environment: staging

      # Verifiser
      - name: Staging health check
        run: |
          sleep 10
          for i in 1 2 3; do
            STATUS=$(curl -s -m 10 "https://staging.klarpakke.no/api/health" | jq -r '.status')
            if [ "$STATUS" = "healthy" ]; then
              echo "✅ Staging healthy"
              exit 0
            fi
            echo "⏳ Venter på staging... ($i/3)"
            sleep 10
          done
          echo "❌ Staging ikke healthy"
          exit 1

  notify:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "✅ Staging deploy OK — https://staging.klarpakke.no"
          else
            echo "❌ Staging deploy feilet — sjekk logs"
          fi
