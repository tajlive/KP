# SIST OPPDATERT: 2026-04-10 - Vercel optimalisering
# ============================================================================
# PR CHECK — Kjører på alle PR + push til main
# ============================================================================

name: ✅ PR Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 🖥️ Runtime-verifisering
        run: |
          echo "Node: $(node -v)"
          echo "npm: $(npm -v)"

      - name: Validate Vercel config
        run: |
          # Check if vercel.json is valid JSON
          if ! jq empty vercel.json 2>/dev/null; then
            echo "::error::vercel.json is not valid JSON"
            exit 1
          fi
          echo "✅ vercel.json is valid JSON"
          
          # Check required fields
          if ! jq -e '.buildCommand' vercel.json >/dev/null; then
            echo "::warning::buildCommand not set in vercel.json"
          fi
          if ! jq -e '.regions' vercel.json >/dev/null; then
            echo "::warning::regions not set in vercel.json"
          fi
          echo "✅ vercel.json validation complete"

      - name: Install dependencies
        run: npm ci --prefer-offline --legacy-peer-deps

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: |
            .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.mjs', 'vercel.json') }}
          restore-keys: |
            next-${{ runner.os }}-

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Generate coverage report
        run: |
          npm run test:unit -- --coverage || true
          node scripts/coverage-report.mjs || true
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage/
            .kimi/ai-health-reports/coverage-*.md
          retention-days: 14

      - name: Validate i18n
        run: npm run i18n:validate

      - name: Client Component Gate
        run: node scripts/ci-client-component-gate.mjs --threshold=5
        continue-on-error: true

      - name: Generate client component report
        run: node scripts/client-component-refactor.mjs
        continue-on-error: true

  build:
    # Kjører kun på PR for å spare GitHub Actions-minutter.
    # På push til main bygger deploy.yml i stedet.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --legacy-peer-deps

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: |
            .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.mjs', 'vercel.json') }}
          restore-keys: |
            next-${{ runner.os }}-

      - name: Build application
        run: npm run build
        env:
          SKIP_LINT_IN_BUILD: 'true'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://vuxbjlykgmzskxbclquf.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-ci-build' }}
          # Sanity — påkrevd for bygg (assertValue i sanity/env.ts)
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID || '63qn23si' }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
          NEXT_PUBLIC_SANITY_API_VERSION: ${{ secrets.NEXT_PUBLIC_SANITY_API_VERSION || '2024-04-07' }}
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/
          retention-days: 1
