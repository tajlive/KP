# SIST OPPDATERT: 2026-03-27 - Node 24 standardisering
# ============================================================================
# PR CHECK - Ved PR til main OG ved push til main (Vercel trenger checks på merge)
# ============================================================================

name: ✅ PR Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize] # Kun ved ny PR eller endringer
  push:
    branches: [main]
    # Kjører på hver merge til main – gir check som Vercel kan kreve før production

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write  # For PR-kommentar ved feil

# Node 24 opt-in for JS actions (checkout, setup-node, cache) — deprecation 2026
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  paths:
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            migrations:
              - 'supabase/migrations/**'

  validate-migrations:
    runs-on: ubuntu-latest
    needs: paths
    if: needs.paths.outputs.migrations == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
      - run: node scripts/validate-migrations.mjs
        name: Valider migrasjonsfiler

  db-status-check:
    runs-on: ubuntu-latest
    needs: paths
    if: needs.paths.outputs.migrations == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
      - name: "🔗 Supabase link"
        id: link
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          REF="${SUPABASE_PROJECT_REF:-$SUPABASE_PROJECT_ID}"
          if [ -z "$REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Mangler Supabase-secrets — hopper over db-status-check"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx supabase link --project-ref "$REF"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
      - name: "🗄️ DB status gate"
        if: steps.link.outputs.skipped != 'true'
        continue-on-error: ${{ vars.DB_STATUS_STRICT != 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: node scripts/db-status-gate.mjs

  quick-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: "npm"

      - name: 🖥️ Runtime-verifisering
        run: |
          echo "Node: $(node -v)"
          echo "npm: $(npm -v)"

      - name: 🔒 Node-policy sjekk
        run: npm run node:policy

      - name: 📦 Install
        run: npm ci --prefer-offline --legacy-peer-deps --legacy-peer-deps

      - name: 🌐 i18n Validering
        run: npm run i18n:validate
        id: i18n

      - name: 🎨 CSS-klasse validering
        run: node scripts/validate-css-classes.mjs
        id: cssvalidate

      - name: 📂 Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.mjs') }}
          restore-keys: next-${{ runner.os }}-

      - name: Prepare typecheck log
        run: touch typecheck.log

      - name: 🔍 Lint
        run: npm run lint

      - name: ⌨️ Type Check
        run: npm run type-check 2>&1 | tee typecheck.log
        id: typecheck

      - name: 🧪 Unit Tests
        run: npm run test:unit
        id: unittest

      - name: 🔍 Duplicate Content Check
        run: npm run test:duplicate
        id: duplicate
        continue-on-error: true

      - name: 📤 Post Duplicate Report to PR
        if: steps.duplicate.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npx tsx scripts/post-duplicate-report.ts

      - name: 🏗️ Build
        run: npm run build
        id: build
        env:
          SKIP_LINT_IN_BUILD: "true"
          # Fallback for fork/nytt repo der secrets mangler – build for å verifisere kompilering
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://vuxbjlykgmzskxbclquf.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJjbG91ZC1wbGFjZWhvbGRlciJ9.c2VjcmV0' }}
        timeout-minutes: 10

      - name: 📋 Failure summary
        if: failure()
        run: |
          echo "## ❌ PR Check failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "One or more steps failed. Open this run and check the failed step (Lint, Type Check, Unit Tests, or Build)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Fix locally:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm run lint -- --quiet" >> $GITHUB_STEP_SUMMARY
          echo "npm run type-check" >> $GITHUB_STEP_SUMMARY
          echo "npm run test:unit" >> $GITHUB_STEP_SUMMARY
          echo "npm run build" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If type-check failed, download the **typecheck** artifact below for the full error output." >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload typecheck log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck
          path: typecheck.log
          retention-days: 3

  # Kommenter på PR ved feil med "Slik fikser du" og oppdater eksisterende kommentar
  pr-comment-on-failure:
    runs-on: ubuntu-latest
    needs: quick-check
    if: failure() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Find or create PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- ci-fix-suggestion -->';
            const body = `## ❌ CI feilet – slik fikser du
            ${marker}

            Kjør lokalt for å reprodusere og fikse:
            \`\`\`bash
            npm run lint -- --quiet
            npm run type-check
            npm run test:unit
            npm run build
            # Eller: npm run verify:automation  # lint + type-check + unit + prod-verify + MCP
            \`\`\`

            **Tips:** Last ned **typecheck**-artifactet fra denne kjøringen for full type-check-output. Se [Feilretting når CI feiler](https://github.com/${{ github.repository }}/blob/main/.github/GITHUB_SETUP.md#7-feilretting-når-ci-feiler) i GITHUB_SETUP.md.

            **Eller skriv \`@cursor\` i en kommentar for å be Cursor Cloud Agent fikse.** Se [CURSOR-CLOUD-PR-AUTOFIX.md](https://github.com/${{ github.repository }}/blob/main/docs/CURSOR-CLOUD-PR-AUTOFIX.md).`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.body && c.body.includes(marker) && c.user.type === 'Bot');
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # Auto-fix lint: kjør lint --fix og push kun når lint var problemet og fix hjelper
  auto-fix-lint:
    runs-on: ubuntu-latest
    needs: quick-check
    if: failure() && github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: ⬇️ Checkout PR-branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: "npm"

      - name: 📦 Install
        run: npm ci --prefer-offline --legacy-peer-deps

      - name: Unngå auto-fix-loop
        id: loop
        run: |
          LAST_MSG=$(git log -1 --pretty=%B)
          if echo "$LAST_MSG" | grep -q "chore(lint): auto-fix"; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 🔧 Lint auto-fix
        if: steps.loop.outputs.skip != 'true'
        run: npm run lint -- --fix

      - name: Sjekk at det ble endringer
        id: changes
        if: steps.loop.outputs.skip != 'true'
        run: |
          if git diff --quiet && git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Verifiser at lint passerer etter fix
        if: steps.loop.outputs.skip != 'true' && steps.changes.outputs.has_changes == 'true'
        run: npm run lint -- --quiet

      - name: Commit og push lint-fix
        if: steps.loop.outputs.skip != 'true' && steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(lint): auto-fix from CI"
          git push origin HEAD
