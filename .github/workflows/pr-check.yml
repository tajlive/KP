# ============================================================================
# PR CHECK - Kun ved PR til main (ikke på hver push)
# ============================================================================

name: ✅ PR Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize] # Kun ved ny PR eller endringer

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write  # For PR-kommentar ved feil

jobs:
  paths:
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            migrations:
              - 'supabase/migrations/**'

  validate-migrations:
    runs-on: ubuntu-latest
    needs: paths
    if: needs.paths.outputs.migrations == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate-migrations.mjs
        name: Valider migrasjonsfiler

  quick-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Install
        run: npm ci --prefer-offline

      - name: 📂 Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.mjs') }}
          restore-keys: next-${{ runner.os }}-

      - name: Prepare typecheck log
        run: touch typecheck.log

      - name: 🔍 Lint
        run: npm run lint -- --quiet

      - name: ⌨️ Type Check
        run: npm run type-check 2>&1 | tee typecheck.log
        id: typecheck

      - name: 🧪 Unit Tests
        run: npm run test:unit
        id: unittest

      - name: 🏗️ Build
        run: npm run build
        id: build
        env:
          SKIP_LINT_IN_BUILD: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        timeout-minutes: 10

      - name: 📋 Failure summary
        if: failure()
        run: |
          echo "## ❌ PR Check failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "One or more steps failed. Open this run and check the failed step (Lint, Type Check, Unit Tests, or Build)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Fix locally:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm run lint -- --quiet" >> $GITHUB_STEP_SUMMARY
          echo "npm run type-check" >> $GITHUB_STEP_SUMMARY
          echo "npm run test:unit" >> $GITHUB_STEP_SUMMARY
          echo "npm run build" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If type-check failed, download the **typecheck** artifact below for the full error output." >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload typecheck log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck
          path: typecheck.log
          retention-days: 3

  # Kommenter på PR ved feil med "Slik fikser du" og oppdater eksisterende kommentar
  pr-comment-on-failure:
    runs-on: ubuntu-latest
    needs: quick-check
    if: failure() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Find or create PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- ci-fix-suggestion -->';
            const body = `## ❌ CI feilet – slik fikser du
            ${marker}

            Kjør lokalt for å reprodusere og fikse:
            \`\`\`bash
            npm run lint -- --quiet
            npm run type-check
            npm run test:unit
            npm run build
            \`\`\`

            **Tips:** Last ned **typecheck**-artifactet fra denne kjøringen for full type-check-output. Se [Feilretting når CI feiler](https://github.com/${{ github.repository }}/blob/main/.github/GITHUB_SETUP.md#7-feilretting-når-ci-feiler) i GITHUB_SETUP.md.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.body && c.body.includes(marker) && c.user.type === 'Bot');
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # Auto-fix lint: kjør lint --fix og push kun når lint var problemet og fix hjelper
  auto-fix-lint:
    runs-on: ubuntu-latest
    needs: quick-check
    if: failure() && github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: ⬇️ Checkout PR-branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Install
        run: npm ci --prefer-offline

      - name: Unngå auto-fix-loop
        id: loop
        run: |
          LAST_MSG=$(git log -1 --pretty=%B)
          if echo "$LAST_MSG" | grep -q "chore(lint): auto-fix"; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 🔧 Lint auto-fix
        if: steps.loop.outputs.skip != 'true'
        run: npm run lint -- --fix

      - name: Sjekk at det ble endringer
        id: changes
        if: steps.loop.outputs.skip != 'true'
        run: |
          if git diff --quiet && git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Verifiser at lint passerer etter fix
        if: steps.loop.outputs.skip != 'true' && steps.changes.outputs.has_changes == 'true'
        run: npm run lint -- --quiet

      - name: Commit og push lint-fix
        if: steps.loop.outputs.skip != 'true' && steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(lint): auto-fix from CI"
          git push origin HEAD
