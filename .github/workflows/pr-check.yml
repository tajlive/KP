# ============================================================================
# PR CHECK - Kun ved PR til main (ikke på hver push)
# ============================================================================

name: ✅ PR Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize] # Kun ved ny PR eller endringer

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Install
        run: npm ci --prefer-offline

      - name: 📂 Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.mjs') }}
          restore-keys: next-${{ runner.os }}-

      - name: 🔍 Lint
        run: npm run lint -- --quiet

      - name: ⌨️ Type Check
        run: npm run type-check

      - name: 🧪 Unit Tests & Coverage
        run: npm run test:coverage

      - name: 🏗️ Build
        run: npm run build
        env:
          SKIP_LINT_IN_BUILD: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        timeout-minutes: 10
