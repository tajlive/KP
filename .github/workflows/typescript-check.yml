name: TypeScript Check

# Kun develop – main dekkes av PR Check og test.yml (unngår duplikat og ødelagt PR-kommentar)
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: typescript-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run TypeScript check
      run: npm run type-check
      continue-on-error: true
      
    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Check if type-check output exists
          const outputPath = path.join(process.env.GITHUB_WORKSPACE, 'type-check-output.txt');
          let body = '## 🔍 TypeScript Check Results\n\n';
          
          if (fs.existsSync(outputPath)) {
            const output = fs.readFileSync(outputPath, 'utf8');
            const errorCount = (output.match(/error TS/g) || []).length;
            
            if (errorCount > 0) {
              body += `⚠️ **${errorCount} TypeScript errors found**\n\n`;
              body += 'Please fix these errors before merging.\n\n';
              body += '<details>\n<summary>View errors</summary>\n\n```\n';
              body += output.slice(0, 3000); // Limit output
              body += '\n```\n</details>';
            } else {
              body += '✅ **No TypeScript errors!**\n\n';
              body += 'All type checks passed.';
            }
          } else {
            body += '⚠️ Could not retrieve type check results.';
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });

  lint:
    name: ESLint Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run ESLint
      run: npm run lint
      continue-on-error: true

  build:
    name: Build Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build application
      run: npm run build
      continue-on-error: true
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
