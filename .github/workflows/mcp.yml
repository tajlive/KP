# ═══════════════════════════════════════════════════════════════════════════════
# MCP WORKFLOW — Konsolidert MCP-håndtering
# ═══════════════════════════════════════════════════════════════════════════════
# Kombinerer: mcp-daily, mcp-health, mcp-integration
#
# Triggers:
#   - schedule: Daglig (mcp-daily)
#   - push: Når .cursor/mcp.json endres (mcp-health)
#   - workflow_dispatch: Manuell
#   - repository_dispatch: Fra andre workflows
# ═══════════════════════════════════════════════════════════════════════════════

name: 🔌 MCP

on:
  schedule:
    - cron: '0 8 * * *'  # Daglig kl 08:00 UTC
  push:
    paths:
      - '.cursor/mcp.json'
      - '.mcp/**'
  workflow_dispatch:
    inputs:
      check_type:
        description: 'Type check'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - health
          - integration
  repository_dispatch:
    types: [mcp-check]

concurrency:
  group: mcp-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ═══════════════════════════════════════════════════════════════
  # MCP HEALTH CHECK — Validerer MCP-konfigurasjon
  # ═══════════════════════════════════════════════════════════════
  health:
    name: 🔍 MCP Health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v5
      
- name: 🏗️ Setup Environment
        uses: ./.github/actions/setup-klarpakke
      
      - name: 🔍 MCP Config Validation
        run: npm run mcp:validate-config
      
      - name: 🔍 MCP Environment Check
        run: npm run mcp:check-supabase-env
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  # MCP INTEGRATION — Tester MCP-tilkoblinger
  # ═══════════════════════════════════════════════════════════════
  integration:
    name: 🔗 MCP Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: health
    if: github.event.inputs.check_type == 'integration' || github.event.inputs.check_type == 'all' || github.event_name == 'schedule'
    
    steps:
      - uses: actions/checkout@v5
      
- name: 🏗️ Setup Environment
        uses: ./.github/actions/setup-klarpakke
      
      - name: 🔗 Test MCP Connections
        run: npm run test:mcp
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  # MCP DAILY — Daglig health rapport til Linear
  # ═══════════════════════════════════════════════════════════════
  daily:
    name: 📊 MCP Daily Report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: health
    if: github.event_name == 'schedule' || github.event.inputs.check_type == 'all'
    
    steps:
      - uses: actions/checkout@v5
      
- name: 🏗️ Setup Environment
        uses: ./.github/actions/setup-klarpakke
      
      - name: 📊 Generate MCP Health Report
        run: |
          echo "## MCP Daily Health Check" >> $GITHUB_STEP_SUMMARY
          echo "$(date -u +"%Y-%m-%d %H:%M UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Config validated" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Health check completed" >> $GITHUB_STEP_SUMMARY
