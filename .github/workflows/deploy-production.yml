name: Deploy to Production
on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitignore'
      - '.husky/**'
      - '.vscode/**'

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --legacy-peer-deps

      - name: Build
        run: npm run cf:build
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://www.klarpakke.no' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy
        run: npx wrangler deploy --minify --var APP_VERSION:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify deployment
        run: |
          echo "### Verifiserer deploy..." >> $GITHUB_STEP_SUMMARY
          BASE="https://www.klarpakke.no"
          VERSION="${{ github.sha }}"
          
          sleep 5
          
          echo "1. Health endpoint"
          STATUS=$(curl -sf "$BASE/api/health" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['status'])" 2>/dev/null || echo "unavailable")
          echo "- $STATUS" >> $GITHUB_STEP_SUMMARY
          
          echo "2. Leaderboard API"
          COUNT=$(curl -sf "$BASE/api/leaderboard?period=weekly" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d))" 2>/dev/null || echo "0")
          echo "- $COUNT entries" >> $GITHUB_STEP_SUMMARY
          
          echo "3. Public pages"
          ERRORS=0
          for p in /no /no/priser /no/om-oss /no/kontakt /no/leaderboard; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 8 "$BASE$p")
            if [ "$code" != "200" ] && [ "$code" != "307" ]; then
              echo "  ❌ $p → $code" >> $GITHUB_STEP_SUMMARY
              ERRORS=$((ERRORS+1))
            else
              echo "  ✅ $p → $code" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ $ERRORS failures" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ All OK" >> $GITHUB_STEP_SUMMARY
