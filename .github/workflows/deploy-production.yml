name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    timeout-minutes: 15
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run cf:build
      - name: Deploy
        run: npx wrangler deploy --minify --var APP_VERSION:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify
        run: |
          sleep 10
          curl -sf "https://www.klarpakke.no/api/health" && echo "✅ Deploy OK"
