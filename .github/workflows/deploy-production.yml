name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Kun én deploy om gangen — nye merges venter (aldri avbryt en pågående deploy)
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Build
        run: npm run cf:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SKIP_LINT_IN_BUILD: "true"
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: "--max-old-space-size=4096"
      - name: Deploy
        run: npx wrangler deploy --minify --var APP_VERSION:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify
        run: |
          sleep 10
          curl -sf "https://www.klarpakke.no/api/health" && echo "✅ Deploy OK"
