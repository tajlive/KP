name: Deploy to Production

on:
  workflow_dispatch:  # Kun manuell — Workers Builds er deaktivert
  # push:  # Deaktivert — Workers Builds gir false positive smoke tests
  #   branches: [main]

jobs:
  deploy:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run cf:build
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --minify --var APP_VERSION:${{ github.sha }}
      - name: Verify
        run: |
          sleep 10
          curl -sf "https://www.klarpakke.no/api/health" && echo "✅ Deploy OK"
