# ============================================================================
# CI Pipeline – Klarpakke
# • QA (lint + typecheck) på alle PRs og push til main
# • Security scan (CodeQL) på push til main
# • Vercel-deploy skjer automatisk via Vercel GitHub-integrasjon (ikke her)
# • Supabase-deploy skjer i supabase-migrations.yml
# ============================================================================

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # ═══════════════════════════════════════════════════════════════
  # QA – Lint + TypeCheck
  # ═══════════════════════════════════════════════════════════════
  qa:
    name: ✅ QA Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

  # ═══════════════════════════════════════════════════════════════
  # Security – CodeQL (kun på push til main)
  # ═══════════════════════════════════════════════════════════════
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true
