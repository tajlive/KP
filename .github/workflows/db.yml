# ═══════════════════════════════════════════════════════════════════════════════
# DB WORKFLOW — Konsolidert database-håndtering
# ═══════════════════════════════════════════════════════════════════════════════
# Kombinerer: db-lint, db-push, db-status, db-push-on-merge
#
# Triggers:
#   - push: Til main når supabase/** endres (auto-push)
#   - pull_request: Når supabase/** endres (lint + status)
#   - workflow_dispatch: Manuell push/lint/status
# ═══════════════════════════════════════════════════════════════════════════════

name: 🗄️ DB

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/db.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action'
        required: true
        default: 'status'
        type: choice
        options:
          - status
          - lint
          - push

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ═══════════════════════════════════════════════════════════════
  # DB STATUS — Sjekker migrasjonsstatus
  # ═══════════════════════════════════════════════════════════════
  status:
    name: 📊 DB Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v5
      
      - name: 🏗️ Setup Environment
        uses: ./.github/actions/setup-klarpakke
        with:
          install: 'false'
      
      - name: 🔗 Supabase Link
        id: link
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Mangler Supabase-secrets"
            exit 0
          fi
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
          echo "linked=true" >> "$GITHUB_OUTPUT"
      
      - name: 📊 DB Status Gate
        if: steps.link.outputs.linked == 'true'
        continue-on-error: ${{ vars.DB_STATUS_STRICT != 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/db-status-gate.mjs

  # ═══════════════════════════════════════════════════════════════
  # DB LINT — PL/pgSQL linting
  # ═══════════════════════════════════════════════════════════════
  lint:
    name: 🔍 DB Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: status
    if: github.event_name == 'pull_request' || github.event.inputs.action == 'lint'
    
    steps:
      - uses: actions/checkout@v5
      
      - name: 🏗️ Setup Environment
        uses: ./.github/actions/setup-klarpakke
        with:
          install: 'false'
      
      - name: 🔗 Supabase Link
        id: link
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Mangler Supabase-secrets"
            exit 0
          fi
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
          echo "linked=true" >> "$GITHUB_OUTPUT"
      
      - name: 🔍 DB Lint
        if: steps.link.outputs.linked == 'true'
        continue-on-error: ${{ vars.DB_LINT_STRICT != 'true' }}
        run: npx supabase db lint

  # ═══════════════════════════════════════════════════════════════
  # DB PUSH — Kjører migrasjoner (kun på main)
  # ═══════════════════════════════════════════════════════════════
  push:
    name: 🚀 DB Push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [status, lint]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.action == 'push')
    
    steps:
      - uses: actions/checkout@v5
      
      - name: 🏗️ Setup Environment
        uses: ./.github/actions/setup-klarpakke
      
      - name: 🔗 Supabase Link
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Mangler Supabase-secrets for DB push"
            exit 1
          fi
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
      
      - name: 🚀 Push Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase db push
      
      - name: 📝 Regenerate Types
        run: npm run db:gen-types
      
      - name: 🔍 Verify Types Match
        run: |
          if [ -n "$(git status --porcelain src/types/supabase-generated.ts)" ]; then
            echo "::error::Types mismatch! Kjør npm run db:ship lokalt og commit."
            exit 1
          fi
