# ═══════════════════════════════════════════════════════════════════════════════
# CRON DAILY MAINTENANCE - Konsolidert Vedlikehold
# ═══════════════════════════════════════════════════════════════════════════════
# Kjører: Daglig kl 07:00 UTC
# Inneholder: 
#   - MemPalace Guard (Dokumentasjonssjekk)
#   - Knowledge Miner (Kunnskapsutvinning)
#   - Version Check (MemPalace oppdateringer)
# ═══════════════════════════════════════════════════════════════════════════════

name: 🛠️ Daily Maintenance

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: daily-maintenance
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # ═══════════════════════════════════════════════════════════════
  # 1. SCAN DOCUMENTATION (Mempalace Guard)
  # ═══════════════════════════════════════════════════════════════
  documentation-guard:
    name: 🏛️ Mempalace Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🏗️ Setup Environment
        uses: ./.github/actions/setup-klarpakke

      - name: 🏛️ Run Mempalace Guard
        run: node scripts/mempalace-guard.mjs
        id: guard
        continue-on-error: true

      - name: 📝 Handle Failure
        if: steps.guard.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🏛️ Mempalace Guard: Documentation Needs Attention';
            const body = `## Documentation Issues Detected\n\nRun: ${context.runId}\nDate: ${new Date().toISOString()}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['documentation', 'maintenance']
            });

  # ═══════════════════════════════════════════════════════════════
  # 2. EXTRACT KNOWLEDGE (Knowledge Miner)
  # ═══════════════════════════════════════════════════════════════
  knowledge-mining:
    name: 🧠 Knowledge Miner
    runs-on: ubuntu-latest
    needs: documentation-guard
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🏗️ Setup Environment
        uses: ./.github/actions/setup-klarpakke

      - name: 🧠 Run Knowledge Miner
        run: node scripts/knowledge-miner.mjs

      - name: 💾 Commit Changes
        run: |
          git config user.name "Knowledge Miner"
          git config user.email "knowledge@klarpakke.bot"
          git add .knowledge/
          if git diff --staged --quiet; then
            echo "ℹ️  No new knowledge to commit"
          else
            git commit -m "🧠 Auto: Daily knowledge mining [$(date +%Y-%m-%d)]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════
  # 3. VERSION CHECK (PyPI Updates)
  # ═══════════════════════════════════════════════════════════════
  version-check:
    name: 📦 Check MemPalace Updates
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Check Latest MemPalace Version
        id: check-version
        run: |
          LATEST=$(curl -s https://api.github.com/repos/milla-jovovich/mempalace/releases/latest | jq -r '.tag_name')
          PYPI_VERSION=$(curl -s https://pypi.org/pypi/mempalace/json | jq -r '.info.version')
          echo "pypi=$PYPI_VERSION" >> $GITHUB_OUTPUT
          echo "latest=$LATEST" >> $GITHUB_OUTPUT

      - name: 📋 Check Installed Version
        id: installed
        run: |
          if command -v mempalace &> /dev/null; then
            INSTALLED=$(pip show mempalace | grep Version | cut -d' ' -f2)
            echo "version=$INSTALLED" >> $GITHUB_OUTPUT
            echo "installed=true" >> $GITHUB_OUTPUT
          else
            echo "installed=false" >> $GITHUB_OUTPUT
          fi

      - name: 🔔 Create Update Notification
        if: steps.installed.outputs.installed == 'true' && steps.installed.outputs.version != steps.check-version.outputs.pypi
        uses: actions/github-script@v7
        with:
          script: |
              const latest = '${{ steps.check-version.outputs.pypi }}';
              const installed = '${{ steps.installed.outputs.version }}';
              const title = `🏛️ MemPalace ${latest} tilgjengelig (du har ${installed})`;
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `## 🏛️ Ny MemPalace-versjon tilgjengelig\n\nInstallert: ${installed}\nNy: ${latest}`,
                labels: ['mempalace', 'update', 'maintenance']
              });
