# SIST OPPDATERT: 2026-03-27 - Node 24 standardisering
# ============================================================================
# DB LINT (PR) – PL/pgSQL-linter mot linket Supabase-prosjekt
# ============================================================================
# Kjører når supabase/** endres på PR til main. --fail-on error; warnings gir ikke exit 1.
#
# Streng PR-blokkering: sett repo-variabel DB_LINT_STRICT=true (Settings → Variables).
# Uten den: continue-on-error på lint-steget slik at eldre ERROR-backlog ikke stopper merge;
# steget blir gult og summary forklarer.
#
# Krever samme secrets som db-push: SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_REF
# (eller SUPABASE_PROJECT_ID). Mangler de → skip med warning (forks / midlertidig).
#
# Lokal paritet: npm run db:lint:ci
# ============================================================================

name: DB lint

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/db-lint.yml'
  workflow_dispatch:

concurrency:
  group: db-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  db-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 🔧 Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'

      - name: Link + db lint (fail on ERROR only)
        id: db_lint
        continue-on-error: ${{ vars.DB_LINT_STRICT != 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          REF="${SUPABASE_PROJECT_REF:-$SUPABASE_PROJECT_ID}"
          if [ -z "$REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Mangler SUPABASE_PROJECT_REF/ID eller SUPABASE_ACCESS_TOKEN — hopper over db lint"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set -e
          npx supabase link --project-ref "$REF"
          npx supabase db lint --linked --fail-on error --level warning

      - name: 📋 Lint-summary
        if: always() && steps.db_lint.outputs.skipped != 'true'
        run: |
          if [ "${{ steps.db_lint.outcome }}" = "failure" ]; then
            echo "## ⚠️ supabase db lint: ERROR" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Det finnes minst én **error** i linteren (inkl. eldre funksjoner / extensions)." >> "$GITHUB_STEP_SUMMARY"
            echo "PR er **ikke** blokkert med mindre repo-variabel **DB_LINT_STRICT=true** er satt." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Lokalt:** \`npm run db:lint:ci\` · **Streng CI:** Settings → Secrets and variables → Actions → Variables → \`DB_LINT_STRICT\` = \`true\`." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.db_lint.outcome }}" = "success" ]; then
            echo "## ✅ supabase db lint: ingen ERROR (fail-on error)" >> "$GITHUB_STEP_SUMMARY"
          fi
