# ============================================================================
# PLAYWRIGHT SMOKE — Verifiserer at deployet landing ikke har fantom-feil
# Trigges av deploy.yml via workflow_run
# ============================================================================
name: 🎭 Playwright Smoke

on:
  workflow_run:
    workflows: ["🚀 Deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Run smoke test
        run: npx playwright test e2e/smoke/landing-smoke.spec.ts
        env:
          PLAYWRIGHT_TEST_BASE_URL: https://www.klarpakke.no
