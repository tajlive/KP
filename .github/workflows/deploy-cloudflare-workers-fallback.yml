name: Deploy to Cloudflare Workers — Fallback

on:
  # Primary auto-deploy is Cloudflare Workers Builds. Use this workflow as a fallback when:
  #   - Workers Builds is disabled/broken
  #   - A hotfix must be deployed immediately without waiting for Builds
  #   - The production version is stale and the Builds trigger has not fired
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit SHA to deploy'
        required: true
        default: 'main'
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      skip_tests:
        description: 'Skip type-check and unit tests'
        required: false
        default: false
        type: boolean

concurrency:
  group: cloudflare-workers-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  check-health:
    name: Check if production is stale
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - id: check
        run: |
          expected="${GITHUB_SHA::7}"
          current=$(curl -s "https://www.klarpakke.no/api/health?deploy=${expected}" | jq -r '.version // empty')
          if [ "$current" = "$expected" ]; then
            echo "Production is already running ${expected}. Skipping fallback deploy."
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "Production is stale (current: ${current:-unknown}, expected: ${expected}). Running fallback deploy."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Build and deploy Worker
    needs: check-health
    if: ${{ github.event_name == 'workflow_dispatch' || needs.check-health.outputs.stale == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit
        timeout-minutes: 5

      - name: Run unit tests
        if: false  # Skip on push — pre-push hook handles tests
        run: npm run test:unit

      - name: Build for Cloudflare Workers
        run: npm run cf:build
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://www.klarpakke.no' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID || '63qn23si' }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
          NEXT_PUBLIC_SANITY_API_VERSION: ${{ vars.NEXT_PUBLIC_SANITY_API_VERSION || '2024-04-07' }}
          NEXT_PUBLIC_GLITCHTIP_DSN: ${{ vars.NEXT_PUBLIC_GLITCHTIP_DSN || '' }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --minify --var APP_VERSION:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://www.klarpakke.no' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID || '63qn23si' }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
          NEXT_PUBLIC_SANITY_API_VERSION: ${{ vars.NEXT_PUBLIC_SANITY_API_VERSION || '2024-04-07' }}
          NEXT_PUBLIC_GLITCHTIP_DSN: ${{ vars.NEXT_PUBLIC_GLITCHTIP_DSN || '' }}

      - name: Page smoke test
        run: |
          echo "🏥 Testing ALL public pages..."
          BASE="https://www.klarpakke.no"
          ERRORS=0

          check_page() {
            local path="$1"
            local code
            code=$(curl -s -o /tmp/kp_page -w "%{http_code}" -m10 "$BASE$path")
            if [ "$code" != "200" ]; then
              echo "  ❌ $path (HTTP $code)"
              ERRORS=$((ERRORS+1))
            elif grep -q "Noe gikk galt" /tmp/kp_page; then
              echo "  ❌ $path (Worker crash)"
              ERRORS=$((ERRORS+1))
            else
              echo "  ✅ $path"
            fi
          }

          # Alle offentlige sider i Klarpakke
          PAGES=(
            "/no"
            "/no/priser"
            "/no/priser/cancel"
            "/no/priser/success"
            "/no/login"
            "/no/register"
            "/no/om-oss"
            "/no/kontakt"
            "/no/bots"
            "/no/leaderboard"
            "/no/binance-guide"
            "/no/kalkulator"
            "/no/hjelp"
            "/no/copy-trading"
            "/no/copy-trading/discover"
            "/api/health"
          )

          for page in "${PAGES[@]}"; do
            check_page "$page"
          done

          echo ""
          echo "Tested ${#PAGES[@]} pages"
          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ $ERRORS failures — BLOCKING deploy"
            exit 1
          fi
          echo "✅ All ${#PAGES[@]} pages OK"

      - name: Wait for production health check
        if: ${{ github.event.inputs.environment == 'production' || github.event.inputs.environment == null }}
        uses: actions/github-script@v7
        with:
          script: |
            const expected = context.sha.substring(0, 7);
            const healthUrl = 'https://www.klarpakke.no/api/health';
            const maxAttempts = 30;
            const delayMs = 10000;

            for (let i = 1; i <= maxAttempts; i++) {
              try {
                const response = await fetch(`${healthUrl}?deploy=${expected}&attempt=${i}`, {
                  headers: { 'Cache-Control': 'no-cache', 'User-Agent': 'Mozilla/5.0 (compatible; KlarpakkeHealth/1.0)' },
                });
                const data = await response.json().catch(() => ({}));

                if (['healthy', 'degraded'].includes(data.status) && data.version === expected) {
                  core.info(`Production is running ${expected} after ${i} attempt(s).`);
                  return;
                }

                core.info(`Attempt ${i}/${maxAttempts} — current version: ${data.version ?? 'unavailable'}`);
              } catch (error) {
                core.info(`Attempt ${i}/${maxAttempts} — health endpoint unavailable: ${error.message}`);
              }

              if (i < maxAttempts) {
                await new Promise(resolve => setTimeout(resolve, delayMs));
              }
            }

            throw new Error(`Production did not expose expected commit ${expected} within ${maxAttempts * delayMs / 1000} seconds.`);

      - name: Deploy summary
        if: always()
        run: |
          echo "## 🚀 Cloudflare Workers Deploy (fallback)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** ${{ github.event.inputs.ref || github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://www.klarpakke.no" >> $GITHUB_STEP_SUMMARY
