name: Pre-Merge Gates

# 2026-08-06: Re-aktivert med GitHub-hosted runner (0 kr).
# Self-hosted runner var offline (startup_failure) — byttet til ubuntu-latest.
# La til: vitest unit-tester, CodeQL SAST, bygg-verifisering.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ============ TYPE SAFETY ============
  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit

  # ============ LINT ============
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx eslint . --max-warnings 0

  # ============ UNIT TESTS (vitest) ============
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vitest run --reporter=verbose

  # ============ BUILD VERIFICATION ============
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: SKIP_LINT_IN_BUILD=true npx next build

  # ============ E2E SMOKE (staging) ============
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          PLAYWRIGHT_TEST_BASE_URL="https://staging.klarpakke.no" \
          BASE_URL="https://staging.klarpakke.no" \
          npx playwright test --config=playwright.allure.config.ts --project=chromium --grep "health|critical|smoke"

  # ============ E2E GOLDEN PATH (staging) ============
  e2e-golden-path:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          PLAYWRIGHT_TEST_BASE_URL="https://staging.klarpakke.no" \
          BASE_URL="https://staging.klarpakke.no" \
          npx playwright test --config=playwright.allure.config.ts --project=chromium e2e/golden-path-auth.spec.ts

  # ============ LIGHTHOUSE QA ============
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm install -g @lhci/cli
      - run: lhci autorun --config=.lighthouserc.json --url=https://staging.klarpakke.no

  # ============ SAST (CodeQL — 0 kr, GitHub Free tier) ============
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v4

  # ============ FINAL GATE ============
  gate:
    needs: [type-check, lint, unit-tests, build, e2e-smoke, e2e-golden-path, lighthouse, codeql]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All gates must pass
        run: |
          echo "Gate results:"
          for job in type-check lint unit-tests build e2e-smoke e2e-golden-path lighthouse codeql; do
            result="${{ needs[env.job].result }}" # not possible in bash — use explicit checks
          done
          if [ "${{ needs.type-check.result }}" != "success" ]; then echo "FAIL: type-check"; exit 1; fi
          if [ "${{ needs.lint.result }}" != "success" ]; then echo "FAIL: lint"; exit 1; fi
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then echo "FAIL: unit-tests"; exit 1; fi
          if [ "${{ needs.build.result }}" != "success" ]; then echo "FAIL: build"; exit 1; fi
          if [ "${{ needs.e2e-smoke.result }}" != "success" ]; then echo "FAIL: e2e-smoke"; exit 1; fi
          if [ "${{ needs.e2e-golden-path.result }}" != "success" ]; then echo "FAIL: e2e-golden-path"; exit 1; fi
          if [ "${{ needs.lighthouse.result }}" != "success" ]; then echo "FAIL: lighthouse"; exit 1; fi
          if [ "${{ needs.codeql.result }}" != "success" ]; then echo "FAIL: codeql"; exit 1; fi
          echo "ALL GATES GREEN — merge allowed"
