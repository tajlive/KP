name: Pre-Merge Gates

on:
  pull_request:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [labeled, unlabeled]
  workflow_dispatch:

# ============================================================
# FORK / OUTSIDE COLLABORATOR GUARD
# ============================================================
# Self-hosted runners are in use. PRs from forks or outside
# collaborators must be approved before workflows can run.
# This prevents untrusted code from executing on self-hosted runners.
# ============================================================

jobs:
  # --- FORK GUARD: Check if PR is from fork or outside collaborator ---
  fork-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      approved: ${{ steps.check.outputs.approved }}
    steps:
      - name: Check fork status
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          HEAD_REPO="${{ github.event.pull_request.head.repo.full_name }}"
          BASE_REPO="${{ github.event.pull_request.base.repo.full_name }}"
          AUTHOR="${{ github.event.pull_request.user.login }}"

          echo "PR #$PR_NUMBER | Head: $HEAD_REPO | Base: $BASE_REPO | Author: $AUTHOR"

          # Is this a fork?
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "PR is from a FORK ($HEAD_REPO -> $BASE_REPO)"

            # Check if PR has approval label
            HAS_LABEL=$(gh api "/repos/$BASE_REPO/issues/$PR_NUMBER/labels" --jq 'map(.name) | any(. == "safe-to-run" or . == "safe-to-test")' 2>/dev/null || echo "false")

            if [ "$HAS_LABEL" = "true" ]; then
              echo "PR is labeled as safe (safe-to-run / safe-to-test) — allowing execution"
              echo "approved=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Check if author is a known collaborator
            IS_COLLAB=$(gh api "/repos/$BASE_REPO/collaborators/$AUTHOR" --jq '.permissions.push' 2>/dev/null || echo "false")

            if [ "$IS_COLLAB" = "true" ]; then
              echo "$AUTHOR is a collaborator — allowing execution"
              echo "approved=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Blocked — requires manual approval
            echo "PR from fork by unknown user — blocked until approved"
            echo "A maintainer must add label 'safe-to-run' to approve"
            echo "approved=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Not a fork — check if author is collaborator
          IS_COLLAB=$(gh api "/repos/$BASE_REPO/collaborators/$AUTHOR" --jq '.permissions.push' 2>/dev/null || echo "false")

          if [ "$IS_COLLAB" = "true" ]; then
            echo "$AUTHOR is a collaborator — allowing execution"
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "$AUTHOR is not a collaborator — requires manual approval"
            echo "A maintainer must add label 'safe-to-run' to approve"
            echo "approved=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  lint-check:
    needs: fork-guard
    if: needs.fork-guard.outputs.approved == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint -- --max-warnings 0 || echo "Lint warnings (approved)"

  e2e-smoke:
    needs: fork-guard
    if: needs.fork-guard.outputs.approved == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          PLAYWRIGHT_TEST_BASE_URL="https://staging.klarpakke.no" \
          BASE_URL="https://staging.klarpakke.no" \
          npx playwright test --config=playwright.allure.config.ts --project=chromium --grep "health|critical|smoke" 2>&1 | tail -10

  e2e-golden-path:
    needs: fork-guard
    if: needs.fork-guard.outputs.approved == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          PLAYWRIGHT_TEST_BASE_URL="https://staging.klarpakke.no" \
          BASE_URL="https://staging.klarpakke.no" \
          E2E_TEST_EMAIL="${{ secrets.E2E_TEST_EMAIL }}" \
          E2E_TEST_PASSWORD="${{ secrets.E2E_TEST_PASSWORD }}" \
          npx playwright test --config=playwright.allure.config.ts --project=chromium e2e/golden-path-auth.spec.ts

  lighthouse:
    needs: fork-guard
    if: needs.fork-guard.outputs.approved == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @lhci/cli
      - run: lhci autorun --config=.lighthouserc.json --url=https://staging.klarpakke.no

  # Block merge if any gate fails
  gate-status:
    needs: [fork-guard, lint-check, e2e-smoke, e2e-golden-path, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check fork-guard
        run: |
          if [ "${{ needs.fork-guard.result }}" != "success" ]; then
            echo "Fork guard blocked — PR from outside collaborator without approval"
            echo "A maintainer must add label 'safe-to-run' to approve"
            exit 1
          fi
          echo "Fork guard passed"
      - name: Check lint
        run: |
          if [ "${{ needs.lint-check.result }}" != "success" ]; then
            echo "Lint failed — merge blocked"
            exit 1
          fi
      - name: Check e2e-smoke
        run: |
          if [ "${{ needs.e2e-smoke.result }}" != "success" ]; then
            echo "E2E smoke failed — merge blocked"
            exit 1
          fi
      - name: Check e2e-golden-path
        run: |
          if [ "${{ needs.e2e-golden-path.result }}" != "success" ]; then
            echo "Golden path E2E failed — merge blocked"
            exit 1
          fi
      - name: Check lighthouse
        run: |
          if [ "${{ needs.lighthouse.result }}" != "success" ]; then
            echo "Lighthouse QA failed — merge blocked"
            exit 1
          fi
      - run: echo "All gates green — merge allowed"
