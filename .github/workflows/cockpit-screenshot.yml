name: Cockpit Screenshot Report

on:
  workflow_dispatch:
    inputs:
      targetUserId:
        description: 'Target user ID (default Viking_NO)'
        required: false
        default: 'Viking_NO'
        type: string
      jobId:
        description: 'Report job ID (UUID)'
        required: true
        type: string

concurrency:
  group: cockpit-screenshot-${{ github.event.inputs.jobId }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  generate-and-upload:
    name: Generate Cockpit screenshots and upload
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Mark job as running
        id: mark-running
        run: node scripts/cockpit-report-update.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COCKPIT_REPORT_JOB_ID: ${{ github.event.inputs.jobId }}
          COCKPIT_REPORT_TARGET_USER_ID: ${{ github.event.inputs.targetUserId }}
          COCKPIT_REPORT_STATUS: running

      - name: Generate screenshots
        id: generate
        run: node scripts/cockpit-screenshot.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          COCKPIT_PREVIEW_USER_EMAIL: ${{ secrets.COCKPIT_PREVIEW_USER_EMAIL }}
          COCKPIT_PREVIEW_USER_PASSWORD: ${{ secrets.COCKPIT_PREVIEW_USER_PASSWORD }}
          COCKPIT_PREVIEW_BASE_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://www.klarpakke.no' }}
          COCKPIT_PREVIEW_OUTPUT_DIR: ${{ runner.temp }}/cockpit-reports
          COCKPIT_PREVIEW_JOB_ID: ${{ github.event.inputs.jobId }}
          COCKPIT_PREVIEW_TARGET_USER_ID: ${{ github.event.inputs.targetUserId }}

      - name: Upload screenshots to Supabase Storage
        id: upload
        run: node scripts/upload-cockpit-report.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COCKPIT_REPORT_JOB_ID: ${{ github.event.inputs.jobId }}
          COCKPIT_REPORT_TARGET_USER_ID: ${{ github.event.inputs.targetUserId }}
          COCKPIT_REPORT_OUTPUT_DIR: ${{ runner.temp }}/cockpit-reports

      - name: Mark job as failed
        if: failure()
        run: node scripts/cockpit-report-update.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COCKPIT_REPORT_JOB_ID: ${{ github.event.inputs.jobId }}
          COCKPIT_REPORT_TARGET_USER_ID: ${{ github.event.inputs.targetUserId }}
          COCKPIT_REPORT_STATUS: failed
          COCKPIT_REPORT_ERROR: 'Workflow failed; see GitHub Actions logs for details.'
