# ============================================================================
# AUTO-LABEL — Legg til labels basert på filendringer
# ============================================================================

name: 🏷️ Auto-label PR

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: auto-label-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Label PR by changed files
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
