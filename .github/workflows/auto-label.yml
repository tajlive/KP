# SIST OPPDATERT: 2026-03-27 - Node 24 standardisering
# ============================================================================
# AUTO-LABEL — Legg til labels basert på filendringer
# ============================================================================

name: 🏷️ Auto-label PR

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: auto-label-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

# Node 24 opt-in for JS actions — deprecation 2026
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Label PR by changed files
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
