# SIST OPPDATERT: 2026-03-27 - Node 24 standardisering
name: 🗄️ Auto Schema Dump

# Opt into Node.js 24 for JS actions (checkout etc.) — deprecation fix
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/schema.sql'
  schedule:
    # Kjør kl 06:00 hver dag (norsk tid = 05:00 UTC)
    - cron: '0 5 * * *'
  workflow_dispatch: # Kan kjøres manuelt

concurrency:
  group: schema-dump-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dump-schema:
    name: Dump Supabase Schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install psql
        run: sudo apt-get install -y postgresql-client

      - name: Dump schema til markdown
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p docs
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M UTC')

          if [ -z "$DATABASE_URL" ]; then
            echo "⚠️  DATABASE_URL secret ikke satt — hopper over psql-dump"
            cat > docs/database-schema.md << 'HEADER'
          # Klarpakke Database Schema
          > Auto-generert: placeholder
          > ⚠️ DATABASE_URL ikke konfigurert — legg til som GitHub Secret for full dump
          HEADER
            exit 0
          fi

          cat > docs/database-schema.md << 'HEADER'
          # Klarpakke Database Schema
          > Auto-generert: placeholder
          > Prosjekt: vuxbjlykgmzskxbclquf
          > IKKE rediger denne filen manuelt — overskrives ved neste push til main
          >
          > **Bruk**: Lim inn hele denne filen øverst i KIMI 2.5 / Claude for full DB-kontekst

          ---

          HEADER

          # Tabelloversikt med RLS-status
          echo '## Tabeller' >> docs/database-schema.md
          echo '' >> docs/database-schema.md
          echo '| Tabell | RLS | Est. rader |' >> docs/database-schema.md
          echo '|--------|-----|------------|' >> docs/database-schema.md

          psql "$DATABASE_URL" -t -A << 'SQL' >> docs/database-schema.md
          SELECT '| ' || t.tablename || ' | ' ||
            CASE WHEN t.rowsecurity THEN '✅' ELSE '❌' END || ' | ' ||
            COALESCE(c.reltuples::bigint::text, '?') || ' |'
          FROM pg_tables t
          LEFT JOIN pg_class c ON c.relname = t.tablename AND c.relnamespace = 'public'::regnamespace
          WHERE t.schemaname = 'public'
          ORDER BY t.tablename;
          SQL

          echo '' >> docs/database-schema.md

          # Kolonner per tabell
          echo '## Kolonner' >> docs/database-schema.md
          echo '' >> docs/database-schema.md

          psql "$DATABASE_URL" << 'SQL' >> docs/database-schema.md
          \pset format markdown
          SELECT
            table_name AS "Tabell",
            column_name AS "Kolonne",
            data_type AS "Type",
            is_nullable AS "Null?",
            COALESCE(column_default, '') AS "Default"
          FROM information_schema.columns
          WHERE table_schema = 'public'
          ORDER BY table_name, ordinal_position;
          SQL

          # RLS policies
          echo '' >> docs/database-schema.md
          echo '## RLS Policies' >> docs/database-schema.md
          echo '' >> docs/database-schema.md

          psql "$DATABASE_URL" << 'SQL' >> docs/database-schema.md
          \pset format markdown
          SELECT
            tablename AS "Tabell",
            policyname AS "Policy",
            cmd AS "Cmd",
            qual AS "USING"
          FROM pg_policies
          WHERE schemaname = 'public'
          ORDER BY tablename, cmd;
          SQL

          echo "Schema dump ferdig: $(wc -l < docs/database-schema.md) linjer"

      - name: Bygg KIMI-kontekstfil
        run: |
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M UTC')
          MIGRATIONS=$(ls supabase/migrations/*.sql 2>/dev/null | tail -5 | xargs -I{} basename {} | tr '\n' ', ')

          cat > docs/kimi-context.md << 'EOF'
          # KIMI 2.5 — Klarpakke Startblokk
          > Kopier ALT under denne linjen og lim inn øverst i KIMI-chatten
          > Sist oppdatert: placeholder

          ---

          ## KONTEKST — KLARPAKKE
          Stack: Next.js 15, TypeScript strict, Supabase (PostgreSQL), Vercel, Tailwind v4, next-intl
          Repo: tajlive/KP
          Supabase prosjekt: vuxbjlykgmzskxbclquf
          Siste migrasjoner: placeholder

          Regler (ALDRI bryt disse):
          - Norsk default, /en/ for engelsk
          - Mobile-first design
          - Ingen hardkodet tekst (bruk next-intl)
          - Ingen fake stats eller villedende claims
          - TypeScript strict — ingen 'any'
          - RLS: alle DB-operasjoner må ha auth.uid() = user_id
          - Feilhåndtering: try/catch + toast på norsk

          ## DATABASE SCHEMA
          $(cat docs/database-schema.md)

          ## OPPGAVE
          [BESKRIV OPPGAVEN HER]

          ## LEVERANSE-FORMAT
          Lever alltid:
          1. Komplett kode (ingen TODO-kommentarer)
          2. Migrasjonsfil hvis DB endres (supabase/migrations/YYYYMMDDHHMMSS_navn.sql)
          3. Testplan: hvilke url/handlinger tester dette
          EOF

          echo "KIMI-kontekstfil: $(wc -l < docs/kimi-context.md) linjer"

      - name: Commit og push
        run: |
          git config user.name "Klarpakke Arkitekt Bot"
          git config user.email "bot@klarpakke.no"
          git add docs/database-schema.md docs/kimi-context.md

          if git diff --staged --quiet; then
            echo "ℹ️ Ingen endringer i schema — hopper over commit"
          else
            git commit -m "chore(docs): Auto-oppdater schema + KIMI-kontekst [skip ci]"
            git push
            echo "✅ Schema og KIMI-kontekst oppdatert"
          fi
