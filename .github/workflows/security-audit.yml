# ============================================================================
# SIKKERHETSAUDIT - Kun 1 gang per uke + manuell trigger
# ============================================================================

name: 🔒 Security Audit

on:
  schedule:
    - cron: "0 9 * * 1"  # Hver mandag kl 09:00 (1 gang per uke)
  workflow_dispatch:  # + manuell trigger

concurrency:
  group: security-audit
  cancel-in-progress: true

# Node 24 opt-in for JS actions — deprecation 2026
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install (kun for audit)
        run: npm ci --prefer-offline --no-audit

      - name: 🛡️ npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: 🔍 Check for secrets
        run: |
          if grep -r "sk-\|pk_live\|ghp_\|AKIA" src/ --include="*.ts" --include="*.tsx" 2>/dev/null; then
            echo "⚠️ Potensielle hemmeligheter funnet!"
            exit 1
          else
            echo "✅ Ingen hemmeligheter funnet"
          fi
        continue-on-error: true

      # Snyk er ikke i package.json — unngår deprecated transitive (global-agent/boolean) i npm ci på Vercel
      - name: 📊 Snyk test (npx, hvis SNYK_TOKEN finnes)
        run: |
          if [ -z "${SNYK_TOKEN}" ]; then
            echo "ℹ️ SNYK_TOKEN mangler — hopper over Snyk (sett secret i repo for ukentlig sjekk)"
            exit 0
          fi
          npx --yes snyk@latest test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true
