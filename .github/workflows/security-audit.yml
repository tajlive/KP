name: Security Audit (KLA-276)

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  secret-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Arch Secret Audit (read-only, metadata-only)
        run: node scripts/security/secret-audit.mjs --check
