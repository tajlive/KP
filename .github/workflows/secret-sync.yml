name: Secret Sync — .env.local → GitHub Actions

# Køres automatisk ved push av .env.local-endringer,
# manuelt fra GitHub UI, eller på schedule.
on:
  push:
    paths:
      - '.env.local'
      - 'scripts/sync-github-actions-secrets.mjs'
  schedule:
    # Kjører hver natt kl. 02:00 UTC — fanger opp drift
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (vis hva som ville blitt synket, ikke skriv)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: secret-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sync secrets til GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      # Trengs for å oppdatere repo-secrets via gh CLI
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer avhengigheter
        run: npm ci --prefer-offline --ignore-scripts

      # Rekonstruer .env.local fra GitHub Secrets
      # Alle nøkler i ALLOWLIST må være tilgjengelig som GitHub Secret
      - name: Rekonstruer .env.local
        run: |
          cat > .env.local << 'ENVEOF'
          SUPABASE_ACCESS_TOKEN=${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF=${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          POSTGRES_URL_NON_POOLING=${{ secrets.POSTGRES_URL_NON_POOLING }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          VERCEL_TOKEN=${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID=${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID=${{ secrets.VERCEL_PROJECT_ID }}
          SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          CRON_SECRET=${{ secrets.CRON_SECRET }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
          E2E_USER_EMAIL=${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD=${{ secrets.E2E_USER_PASSWORD }}
          ENVEOF

      - name: Kjør secret-sync
        run: |
          DRY=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY="--dry-run"
          fi
          node scripts/sync-github-actions-secrets.mjs $DRY
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Varsle ved feil
        if: failure()
        run: |
          echo "::error title=Secret Sync feilet::Sjekk at GH_PAT har 'secrets' write-tilgang og at alle nøkler i ALLOWLIST finnes som GitHub Secrets."
