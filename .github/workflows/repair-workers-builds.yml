name: Repair Cloudflare Workers Builds

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run setup-workers-builds.mjs in dry-run mode first'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  repair:
    name: Repair Workers Builds trigger
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --legacy-peer-deps

      - name: Run setup-workers-builds.mjs
        run: node scripts/setup-workers-builds.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '80d5b1d56a3e907150ba7348b6182894' }}
          GH_PAT: ${{ secrets.GH_PAT }}
