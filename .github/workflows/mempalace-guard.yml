# ═══════════════════════════════════════════════════════════════════════════════
# MEMPALACE GUARD - Dokumentasjonsovervåkning
# ═══════════════════════════════════════════════════════════════════════════════
# Sjekker at all dokumentasjon er oppdatert og konsistent
# Kjører daglig og ved endringer i docs/
# ═══════════════════════════════════════════════════════════════════════════════

name: 🏛️ Mempalace Guard

on:
  schedule:
    - cron: '0 9 * * *'  # Hver dag kl 09:00
  push:
    paths:
      - 'docs/**'
      - '*.md'
  pull_request:
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  guard:
    name: 🔍 Scan Documentation
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Trenger git history
      
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      
      - name: 🏛️ Run Mempalace Guard
        run: node scripts/mempalace-guard.mjs
        id: guard
        continue-on-error: true
      
      - name: 📝 Create Issue on Failure
        if: steps.guard.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🏛️ Mempalace Guard: Documentation Needs Attention';
            const body = `## Documentation Issues Detected
            
            Run: ${context.runId}
            Date: ${new Date().toISOString()}
            
            Please run \`node scripts/mempalace-guard.mjs\` locally to see details.
            
            ### Common Fixes:
            - Update outdated files
            - Fix broken links
            - Add missing documentation
            - Review code references`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['documentation', 'maintenance']
            });
      
      - name: 💬 PR Comment
        if: github.event_name == 'pull_request' && steps.guard.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🏛️ **Mempalace Guard** detected documentation issues. Please check the logs.'
            });
