name: 🏛️ Mempalace Guard

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'src/lib/trading/**'
      - 'supabase/functions/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  guard:
    name: Validate Knowledge & Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/checkout@f4
        with:
          node-version: '20'

      - name: Run Mempalace Guard
        run: node scripts/mempalace-guard.mjs
        continue-on-error: false

      - name: Check for Code-Doc Drift
        run: |
          # Sjekk om kritiske filer har endret seg uten at docs er oppdatert
          # Dette er en enkel sjekk, scripts/mempalace-guard.mjs gjør dypere analyse
          echo "Scanning for architectural drift..."
          node scripts/mempalace-guard.mjs --strict
