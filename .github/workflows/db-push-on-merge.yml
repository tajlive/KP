# ============================================================================
# DB PUSH ON MERGE – Kjør migrasjoner automatisk ved push til main
# ============================================================================
# Varig løsning: Migrasjoner kjøres alltid når kode merges til main.
# Unngår at migrasjoner ligger ubrukte mellom merge og neste manuell deploy.
#
# Kjører bare når supabase/ endres (sparer Actions-minutter).
# Krever: SUPABASE_PROJECT_REF, SUPABASE_ACCESS_TOKEN
# ============================================================================

name: DB push (auto on merge)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/db-push*.yml'

concurrency:
  group: db-push-main
  cancel-in-progress: false

# Node 24 opt-in for JS actions — deprecation 2026
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  db-push:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node (for npx supabase)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Supabase link and push
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          REF="${SUPABASE_PROJECT_REF:-$SUPABASE_PROJECT_ID}"
          if [ -z "$REF" ]; then echo "::warning::Mangler SUPABASE_PROJECT_REF/SUPABASE_PROJECT_ID — hopper over db push"; exit 0; fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::warning::Mangler SUPABASE_ACCESS_TOKEN — hopper over db push"; exit 0; fi
          npx supabase link --project-ref "$REF"
          npx supabase db push

      - name: Note
        run: echo "Se docs/SUPABASE-MIGRASJONER-VARIG-LOSNING.md ved manuell oppfølging."
