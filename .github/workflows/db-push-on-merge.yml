# ============================================================================
# DB PUSH ON MERGE – Kjør migrasjoner automatisk ved push til main
# ============================================================================
# Varig løsning: Migrasjoner kjøres alltid når kode merges til main.
# Unngår at migrasjoner ligger ubrukte mellom merge og neste manuell deploy.
#
# Kjører bare når supabase/ endres (sparer Actions-minutter).
# Krever: SUPABASE_PROJECT_REF, SUPABASE_ACCESS_TOKEN
# ============================================================================

name: 🗄️ DB push (auto on merge)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/db-push*.yml'

concurrency:
  group: db-push-main
  cancel-in-progress: false

# Node 24 opt-in for JS actions — deprecation 2026
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  db-push:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Ikke blokkér andre workflows – feil pga manglende secrets er ok
    continue-on-error: true
    # Kun ved push til main
    if: github.ref == 'refs/heads/main'
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node (for npx supabase)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🗄️ Supabase link & push
        run: |
          REF="${{ secrets.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_ID }}"
          if [ -z "$REF" ]; then echo "::error::Mangler SUPABASE_PROJECT_REF eller SUPABASE_PROJECT_ID"; exit 1; fi
          npx supabase link --project-ref "$REF"
          npx supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: ✅ Migrasjoner applisert
        run: echo "Migrasjoner kjørt mot prod. Ved feil: se docs/SUPABASE-MIGRASJONER-VARIG-LOSNING.md §6."
