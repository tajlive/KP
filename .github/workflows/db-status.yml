# ============================================================================
# DB STATUS (PR) – Sjekker migrasjonsstatus mot linket Supabase-prosjekt
# ============================================================================
# Kjører når supabase/** endres på PR til main.
# Allowlister 999_fix_materialized_view (legacy, applied on remote).
# Se docs/MIGRATION-POLICY.md og scripts/db-status-gate.mjs for detaljer.
#
# Streng PR-blokkering: sett repo-variabel DB_STATUS_STRICT=true
# Uten den: continue-on-error slik at legacy-backlog ikke stopper merge.
#
# Krever: SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_REF (eller SUPABASE_PROJECT_ID)
# Lokal paritet: npm run db:status:gate
# ============================================================================

name: DB status

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/db-status-gate.mjs'
      - '.github/workflows/db-status.yml'
  workflow_dispatch:

concurrency:
  group: db-status-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  db-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 🔗 Supabase link
        id: link
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          REF="${SUPABASE_PROJECT_REF:-$SUPABASE_PROJECT_ID}"
          if [ -z "$REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Mangler Supabase-secrets — hopper over db-status-gate"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx supabase link --project-ref "$REF"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: 📝 Supabase CLI version
        if: steps.link.outputs.skipped != 'true'
        run: supabase --version || npx supabase --version

      - name: "\U0001F5C4\uFE0F DB status gate (allowlist)"
        id: db_status
        if: steps.link.outputs.skipped != 'true'
        continue-on-error: ${{ vars.DB_STATUS_STRICT != 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: node scripts/db-status-gate.mjs

      - name: 📋 Status-summary
        if: always() && steps.link.outputs.skipped != 'true'
        run: |
          if [ "${{ steps.db_status.outcome }}" = "failure" ]; then
            echo "## ⚠️ supabase db status: MISMATCH" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Det finnes migrasjoner som ikke matcher remote-historikk." >> "$GITHUB_STEP_SUMMARY"
            echo "PR er **ikke** blokkert med mindre repo-variabel **DB_STATUS_STRICT=true** er satt." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Allowlist aktiv:** \`999_fix_materialized_view\` er fritatt. Se \`docs/MIGRATION-POLICY.md\`." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Lokalt:** \`npm run db:status:gate\` · **Streng CI:** Settings → Variables → \`DB_STATUS_STRICT\` = \`true\`." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.db_status.outcome }}" = "success" ]; then
            echo "## ✅ supabase db status: pass (allowlist aktiv)" >> "$GITHUB_STEP_SUMMARY"
          fi
