# SIST OPPDATERT: 2026-03-27 - Node 24 standardisering
name: E2E Critical Tests

on:
  push:
    branches: [main]
  # Kun push til main (ikke PR) – reduserer flaky failures på hver PR-push
  # E2E kjører etter merge; for PR validering bruk pr-check
  schedule:
    # Run daily at 06:00 UTC (early morning to avoid peak hours)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Node 24 opt-in for JS actions — deprecation 2026
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e-critical:
    name: Critical E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gjør Node 24-opt-in eksplisitt per job (unngår deprecations-varsler på JS-actions).
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    # Ikke bruk GitHub "Environment" her — kan blokkere job-opprettelse (0 jobs) ved gate/approval.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 🖥️ Runtime-verifisering
        run: |
          echo "Node: $(node -v)"
          echo "npm: $(npm -v)"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      # E2E-bruker + automatisk copy-leader (local+e2e-copy-leader@domain, samme passord) og leaderboard_bots.
      # Overstyres med E2E_LEADER_* eller TEST_USER_B_* om satt. E2E_AUTO_COPY_LEADER=0 skrur av auto.
      - name: Provision E2E test user (Supabase Admin)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || 'https://vuxbjlykgmzskxbclquf.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL || secrets.TEST_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD || secrets.TEST_USER_PASSWORD }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL || secrets.E2E_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || secrets.E2E_USER_PASSWORD }}
          # Valgfri: annen bruker som får leaderboard_bots-rad (discover / copy-trading E2E).
          E2E_LEADER_EMAIL: ${{ secrets.E2E_LEADER_EMAIL || secrets.TEST_USER_B_EMAIL }}
          E2E_LEADER_PASSWORD: ${{ secrets.E2E_LEADER_PASSWORD || secrets.TEST_USER_B_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::notice title=E2E provision::SUPABASE_SERVICE_ROLE_KEY mangler — hopper over automatisk opprettelse. Brukeren må finnes i Supabase."
            exit 0
          fi
          if [ -z "$E2E_USER_EMAIL" ] || [ -z "$E2E_USER_PASSWORD" ]; then
            echo "::notice title=E2E provision::E2E_USER_EMAIL / E2E_USER_PASSWORD mangler — hopper over provision."
            exit 0
          fi
          node scripts/create-test-users.js --from-env

      # CI: kun Chromium (Firefox er ofte ustabil i headless Linux)
      - name: Run Critical E2E Tests
        run: npm run test:e2e:critical:chromium
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://www.klarpakke.no' }}
          # Sett til 1 i repo Variables når integrity-sync-knappen er i prod — da feiler testen hvis knappen mangler.
          E2E_REQUIRE_INTEGRITY_SYNC: ${{ vars.E2E_REQUIRE_INTEGRITY_SYNC || '0' }}
          # Én kilde per nøkkel (duplikate YAML-nøkler kan gi workflow-feil uten jobs).
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || 'https://vuxbjlykgmzskxbclquf.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL || secrets.TEST_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD || secrets.TEST_USER_PASSWORD }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL || secrets.E2E_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || secrets.E2E_USER_PASSWORD }}
          TEST_USER_B_EMAIL: ${{ secrets.TEST_USER_B_EMAIL }}
          TEST_USER_B_PASSWORD: ${{ secrets.TEST_USER_B_PASSWORD }}

      # HTML-rapport (playwright-report), JSON + GitHub summary (rot), blob/trace (test-results/) — kan mangle ved grønn kjøring.
      - name: Upload Playwright artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e
          path: |
            playwright-report
            test-results.json
            test-summary.md
            test-results
          if-no-files-found: ignore
          retention-days: 7

  notify-failure:
    name: Notify on Failure
    needs: e2e-critical
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Slack Notification
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        continue-on-error: true
        uses: slackapi/slack-github-action@v2
        with:
          payload: |
            {
              "text": "🚨 E2E Critical Tests FAILED on main",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚨 E2E Critical Tests Failed"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.ref }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ github.sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author:*\n${{ github.actor }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
