# SIST OPPDATERT: 2026-03-27 - Node 24 standardisering
name: TypeScript Check (Blocking)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Avbryt parallelle kjøringer på samme branch
concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

# Node 24 opt-in for JS actions — deprecation 2026
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 🖥️ Runtime-verifisering
        run: |
          echo "Node: $(node -v)"
          echo "npm: $(npm -v)"

      - name: Install dependencies
        run: npm ci --prefer-offline

      # Kjør tsc — feiler hard ved TypeScript-feil (ingen || true)
      - name: TypeScript check
        run: npx tsc --noEmit

      # Ekstra: scan for kjente Supabase .eq()-mønstre
      - name: Supabase column guard
        run: node scripts/guard-supabase-columns.mjs
        continue-on-error: false

      - name: ✅ TypeScript OK
        run: echo "Ingen TypeScript-feil funnet."
