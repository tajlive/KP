name: Extract Secret
on: workflow_dispatch

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Write secret to file
        run: echo "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" > supabase-key.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-keys
          path: supabase-key.txt
