# SIST OPPDATERT: 2026-05-14 - Migrated to Fly.io
# ============================================================================
# DEPLOY — Triggeres av workflow_run (pr-check + test) + manuell trigger
# ============================================================================

name: 🚀 Deploy

on:
  # Auto-deploy: kun når pr-check er successful på main
  workflow_run:
    workflows: ["✅ PR Check"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy til'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

# Node 24 opt-in for JS actions — deprecation 2026
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Build + Fly.io deploy kan bruke >15 min
    timeout-minutes: 45
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    env:
      IS_PRODUCTION: ${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production') }}

    steps:
      - name: Resolve deploy ref (Plan B)
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 50

      - name: 🏗️ Setup Environment
        uses: ./.github/actions/setup-klarpakke

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: |
            .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.mjs') }}
          restore-keys: |
            next-${{ runner.os }}-

      # Alltid exit 0: unngår «Process completed with exit code 1»-annotasjon når push feiler men deploy skal fortsette.
      - name: Supabase migrations (kun production)
        if: env.IS_PRODUCTION == 'true'
        run: |
          set +e
          npx supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          LINK_EXIT=$?
          npx supabase db push
          PUSH_EXIT=$?
          set -e
          if [ "$LINK_EXIT" -ne 0 ] || [ "$PUSH_EXIT" -ne 0 ]; then
            echo "::warning::Supabase link/db push ikke OK (link=$LINK_EXIT push=$PUSH_EXIT). Deploy fortsetter — sjekk migrasjoner manuelt ved behov."
          else
            echo "Supabase migrations OK"
          fi
          exit 0
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Build
        run: npm run build
        env:
          SKIP_LINT_IN_BUILD: 'true'
          FLY_IO: '1'
          NEXT_TELEMETRY_DISABLED: '1'
          NODE_OPTIONS: '--max-old-space-size=4096'
          TURBOPACK: '0'
          NEXT_PUBLIC_APP_URL: 'https://www.klarpakke.no'
          NEXT_PUBLIC_APP_VERSION: '1.0.0'
          NEXT_PUBLIC_GITHUB_SHA: ${{ github.sha }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://vuxbjlykgmzskxbclquf.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID || '63qn23si' }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
          NEXT_PUBLIC_SANITY_API_VERSION: ${{ secrets.NEXT_PUBLIC_SANITY_API_VERSION || '2024-04-07' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        id: fly-deploy
        run: |
          flyctl deploy --remote-only --app klarpakke
          echo "url=https://www.klarpakke.no" >> $GITHUB_OUTPUT
          echo "environment=production" >> $GITHUB_OUTPUT
          echo "Deployed to: https://www.klarpakke.no"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: 🚀 Deploy Edge Functions
        if: env.IS_PRODUCTION == 'true'
        run: |
          npx supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          npx supabase functions deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true

      - name: Wait for production health
        if: env.IS_PRODUCTION == 'true'
        run: |
          echo "Waiting for https://www.klarpakke.no/api/health ..."
          for i in $(seq 1 36); do
            if curl -sfS -o /dev/null --max-time 15 "https://www.klarpakke.no/api/health"; then
              echo "Health OK after ${i} attempt(s)"
              exit 0
            fi
            echo "Attempt $i/36 — sleeping 10s"
            sleep 10
          done
          echo "::error::Production health did not become ready in time"
          exit 1

      - name: Verify production
        if: env.IS_PRODUCTION == 'true'
        id: verify
        run: npm run verify

      - name: Purge Cloudflare cache
        if: env.IS_PRODUCTION == 'true' && success()
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' || true

      - name: Revalidate Next.js ISR cache
        if: env.IS_PRODUCTION == 'true' && success()
        run: |
          echo "Invalidating ISR cache for key paths..."
          curl -sfS "https://www.klarpakke.no/api/revalidate?secret=${{ secrets.REVALIDATE_SECRET }}&path=/no&path=/en" || echo "⚠️ Revalidate failed (non-blocking)"
          curl -sfS "https://www.klarpakke.no/api/revalidate?secret=${{ secrets.REVALIDATE_SECRET }}&path=/no/kontakt&path=/en/contact" || true
        continue-on-error: true

      - name: 🔔 Slack notification on failure
        if: failure() && env.IS_PRODUCTION == 'true'
        run: npx tsx scripts/notify-deploy-status.ts --status=error --url=https://www.klarpakke.no --message="Deploy eller verify feilet, se GitHub Actions"
        env:
          SLACK_DEPLOY_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
        continue-on-error: true

      - name: 🔔 Slack notification on success
        if: success() && env.IS_PRODUCTION == 'true'
        run: npx tsx scripts/notify-deploy-status.ts --status=success --url=https://www.klarpakke.no
        env:
          SLACK_DEPLOY_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
        continue-on-error: true

      - name: Deploy summary
        if: always()
        run: |
          echo "## 🚀 Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$IS_PRODUCTION" == "true" ]; then
            echo "**Environment:** Production ✅" >> $GITHUB_STEP_SUMMARY
            echo "**URL:** https://www.klarpakke.no" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Environment:** Preview 🔄" >> $GITHUB_STEP_SUMMARY
            echo "**URL:** https://klarpakke.fly.dev" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Optimaliseringer aktivert:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Next.js build cache" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Fly.io deploy" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Node 24 runtime" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Telemetry disabled" >> $GITHUB_STEP_SUMMARY
