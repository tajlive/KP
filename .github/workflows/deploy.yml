# ============================================================================
# DEPLOY – Vercel Production
# Kjøres automatisk ved push til main
# ============================================================================

name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: 🚀 Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🚀 Deploy
        run: npx vercel deploy --prod --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

      - name: ✅ Sammendrag
        if: success()
        run: |
          echo "## ✅ Vercel Deploy OK" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Kjørt av | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tidspunkt | $(date -u) |" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Feil-sammendrag
        if: failure()
        run: |
          echo "## ❌ Vercel Deploy FEILET" >> $GITHUB_STEP_SUMMARY
          echo "Sjekk loggene: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
