# SIST OPPDATERT: 2026-04-10 - Vercel optimalisering
# ============================================================================
# DEPLOY — Automatisk ved merge til main + manuell trigger
# ============================================================================

name: 🚀 Deploy

on:
  # Plan B (no branch protection): only deploy after green PR Check on main
  workflow_run:
    workflows: ["✅ PR Check"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy til'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

# Node 24 opt-in for JS actions — deprecation 2026
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Build + Vercel upload kan bruke >15 min (særlig med kald cache)
    timeout-minutes: 30
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')

    env:
      IS_PRODUCTION: ${{ github.event_name == 'workflow_run' || github.event.inputs.environment == 'production' }}

    steps:
      - name: Resolve deploy ref (Plan B)
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.ref }}
          # Fetch full history for better Vercel deploy info
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 🖥️ Runtime-verifisering
        run: |
          echo "Node: $(node -v)"
          echo "npm: $(npm -v)"

      - name: Install dependencies
        run: npm ci --prefer-offline --legacy-peer-deps

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: |
            .next/cache
            .turbo
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.mjs', 'vercel.json') }}
          restore-keys: |
            next-${{ runner.os }}-

      - name: Restore Vercel CLI cache
        uses: actions/cache@v5
        with:
          path: ~/.local/share/vercel
          key: vercel-cli-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: vercel-cli-${{ runner.os }}-

      # Alltid exit 0: unngår «Process completed with exit code 1»-annotasjon når push feiler men deploy skal fortsette.
      - name: Supabase migrations (kun production)
        if: env.IS_PRODUCTION == 'true'
        run: |
          set +e
          npx supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          LINK_EXIT=$?
          npx supabase db push
          PUSH_EXIT=$?
          set -e
          if [ "$LINK_EXIT" -ne 0 ] || [ "$PUSH_EXIT" -ne 0 ]; then
            echo "::warning::Supabase link/db push ikke OK (link=$LINK_EXIT push=$PUSH_EXIT). Deploy fortsetter — sjekk migrasjoner manuelt ved behov."
          else
            echo "Supabase migrations OK"
          fi
          exit 0
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Build
        run: npm run build
        env:
          SKIP_LINT_IN_BUILD: 'true'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://vuxbjlykgmzskxbclquf.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Optimalisering: deaktiver telemetri i CI
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Verify vercel.json
        run: |
          echo "=== vercel.json content ==="
          cat vercel.json
          echo ""
          echo "=== Checking for installCommand ==="
          if grep -q "installCommand" vercel.json; then
            echo "ERROR: installCommand found in vercel.json!"
            exit 1
          else
            echo "OK: installCommand not found"
          fi

      # --no-wait: CLI kan henge lenge på «Completing…» etter vellykket deploy (GitHub job-timeout).
      - name: Deploy to Vercel
        id: vercel-deploy
        run: |
          if [ "$IS_PRODUCTION" == "true" ]; then
            DEPLOY_URL=$(npx vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }} --yes --meta commit=${{ github.sha }} --meta branch=main)
            echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            DEPLOY_URL=$(npx vercel deploy --token ${{ secrets.VERCEL_TOKEN }} --yes --meta commit=${{ github.sha }} --meta branch=${{ github.ref_name }})
            echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
            echo "environment=preview" >> $GITHUB_OUTPUT
          fi
          echo "Deployed to: $DEPLOY_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Gi Vercel/edge noen sekunder før verify (særlig etter --no-wait)
      - name: 🚀 Deploy Edge Functions
        if: env.IS_PRODUCTION == 'true'
        run: |
          npx supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          npx supabase functions deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true

      - name: Wait for production edge
        if: env.IS_PRODUCTION == 'true'
        run: |
          echo "Waiting for https://www.klarpakke.no/api/health ..."
          for i in $(seq 1 36); do
            if curl -sfS -o /dev/null --max-time 15 "https://www.klarpakke.no/api/health"; then
              echo "Health OK after ${i} attempt(s)"
              exit 0
            fi
            echo "Attempt $i/36 — sleeping 10s"
            sleep 10
          done
          echo "::error::Production health did not become ready in time"
          exit 1

      # Ingen continue-on-error: feilet verify skal feile jobben (tydelig signal i gh / Slack).
      - name: Verify production
        if: env.IS_PRODUCTION == 'true'
        id: verify
        run: npm run verify

      - name: Rollback on failure
        if: failure() && env.IS_PRODUCTION == 'true' && steps.verify.outcome == 'failure'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          echo "🚨 Deployment verification failed - initiating rollback"
          npx vercel rollback --token ${{ secrets.VERCEL_TOKEN }} --yes || echo "Rollback may have failed - manual intervention required"
          exit 1  # Fail the job after rollback attempt

      - name: Purge Cloudflare cache
        if: env.IS_PRODUCTION == 'true' && success()
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' || true

      - name: 🔔 Slack notification on failure
        if: failure() && env.IS_PRODUCTION == 'true'
        run: npx tsx scripts/notify-deploy-status.ts --status=error --url=https://www.klarpakke.no --message="Deploy eller verify feilet, se GitHub Actions"
        env:
          SLACK_DEPLOY_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
        continue-on-error: true

      - name: 🔔 Slack notification on success
        if: success() && env.IS_PRODUCTION == 'true'
        run: npx tsx scripts/notify-deploy-status.ts --status=success --url=https://www.klarpakke.no
        env:
          SLACK_DEPLOY_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
        continue-on-error: true

      - name: Deploy summary
        if: always()
        run: |
          echo "## 🚀 Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$IS_PRODUCTION" == "true" ]; then
            echo "**Environment:** Production ✅" >> $GITHUB_STEP_SUMMARY
            echo "**URL:** https://www.klarpakke.no" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Environment:** Preview 🔄" >> $GITHUB_STEP_SUMMARY
            echo "**URL:** ${{ steps.vercel-deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Optimaliseringer aktivert:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Next.js build cache" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Vercel CLI cache" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Node 24 runtime" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Telemetry disabled" >> $GITHUB_STEP_SUMMARY
