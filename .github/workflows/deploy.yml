# ============================================================================
# DEPLOY – Vercel Production
# ============================================================================

name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: 🚀 Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Debug Vercel Config
        run: |
          echo "Org ID: $VERCEL_ORG_ID"
          echo "Project ID: $VERCEL_PROJECT_ID"
          cat .vercel/project.json || echo "No local project.json"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🏗️ Build
        run: npx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: 🚀 Deploy
        run: npx vercel@latest deploy --prod --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --yes --archive=tgz
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🔗 Alias to www.klarpakke.no
        run: |
          # Get deployment URL and alias it
          DEPLOY_URL=$(npx vercel@latest inspect --token=${{ secrets.VERCEL_TOKEN }} --json | jq -r '.url')
          echo "Deployed to: $DEPLOY_URL"
          npx vercel@latest alias $DEPLOY_URL www.klarpakke.no --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        continue-on-error: true

      - name: ✅ Verify Deploy
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://www.klarpakke.no/no)
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "307" ]; then
            echo "✅ Deploy verified! HTTP $STATUS"
          else
            echo "⚠️ Deploy may have issues. HTTP $STATUS"
          fi
        continue-on-error: true

      - name: ✅ Sammendrag
        if: success()
        run: |
          echo "## ✅ Vercel Deploy OK" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Kjørt av | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tidspunkt | $(date -u) |" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Feil-sammendrag
        if: failure()
        run: |
          echo "## ❌ Vercel Deploy FEILET" >> $GITHUB_STEP_SUMMARY
          echo "Sjekk loggene: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
