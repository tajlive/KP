name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ============ TEST-GATE (2026-08-08): alt som deployes må først passere
  # tsc + eslint + full vitest-suite. Før denne jobben fantes, kjørte deploy
  # NULL tester (pre-merge-gates kjører kun på PR — vi committer til main).
  test-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Unit + component tests (vitest)
        run: npx vitest run --reporter=verbose
        env:
          CI: 'true'

  security-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Arch Secret Audit (KLA-276 — read-only, metadata-only)
        run: node scripts/security/secret-audit.mjs --check

  deploy:
    needs: [test-gate, security-check]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Build (Next.js → Cloudflare Workers)
        run: npm run cf:build
        env:
          SKIP_LINT_IN_BUILD: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
          NODE_OPTIONS: '--max-old-space-size=4096'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: 'https://www.klarpakke.no'
          NEXT_PUBLIC_STRIPE_PRICE_BACHELOR: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_BACHELOR }}
          NEXT_PUBLIC_STRIPE_PRICE_MASTER: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_MASTER }}
          NEXT_PUBLIC_STRIPE_PRICE_PHD: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_PHD }}
          NEXT_PUBLIC_STRIPE_PRICE_PROFESSOR: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_PROFESSOR }}

      - name: Deploy to Cloudflare Workers
        run: |
          DEPLOY_TAG="ci-${GITHUB_SHA::7}"
          set +e
          npx wrangler versions upload --env "" --tag "$DEPLOY_TAG" --message "CI: ${GITHUB_SHA::7}" 2>&1 | tail -20
          UPLOAD_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$UPLOAD_EXIT" -ne 0 ]; then
            echo "::error::versions upload failed (exit $UPLOAD_EXIT)"
            exit 1
          fi
          npx wrangler versions deploy --version-tag "$DEPLOY_TAG" --yes --message "CI deploy: ${GITHUB_SHA::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: 'true'
          WRANGLER_LOG: error

      - name: Purge CDN cache
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/328d7de7e8e48308fd4f9d760da57946/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}'

      - name: Health check
        run: |
          sleep 5
          curl -sf https://www.klarpakke.no/api/health | python3 -m json.tool

  # ============ POST-DEPLOY E2E-SMOKE (2026-08-08): verifiserer prod med
  # ekte nettleser etter hver deploy — uautentiserte, stabile tester:
  # health (API), landing-smoke (side laster) og i18n-keys (ingen rå
  # nøkkelstier — fanger trading.cockpit-regresjonen automatisk).
  e2e-smoke-prod:
    needs: [deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke mot prod (health + landing + i18n-keys)
        run: |
          npx playwright test \
            --config=playwright.allure.config.ts \
            --project=chromium \
            e2e/smoke/health.spec.ts e2e/smoke/landing-smoke.spec.ts e2e/smoke/i18n-keys.spec.ts
        env:
          CI: 'true'
          E2E_BASE_URL: 'https://www.klarpakke.no'
          PLAYWRIGHT_TEST_BASE_URL: 'https://www.klarpakke.no'
          BASE_URL: 'https://www.klarpakke.no'

  # ============ POST-DEPLOY INNLOGGET SMOKE (2026-08-09): 2026-standard.
  # Bakgrunn: QueryClientProvider-krasj på /no/dashboard nådde prod og ble
  # oppdaget av BRUKEREN. Uautentisert smoke kan ALDRI fange innloggede
  # JS-krasj — denne jobben logger inn med QA-bruker og verifiserer
  # kjerneflyten med ekte nettleser UMIDDELBART etter deploy.
  e2e-smoke-auth-prod:
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      status: ${{ job.status }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Innlogging (QA-bruker) — genererer e2e/.auth/user.json
        run: npx playwright test --config=playwright.auth.config.ts
        env:
          CI: 'true'
          TEST_BASE_URL: 'https://www.klarpakke.no'
          PLAYWRIGHT_TEST_BASE_URL: 'https://www.klarpakke.no'
          E2E_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Innlogget smoke (dashboard + handel, console-guard)
        run: |
          npx playwright test \
            --config=playwright.allure.config.ts \
            --project=chromium-auth \
            e2e/smoke/auth-dashboard-smoke.spec.ts
        env:
          CI: 'true'
          TEST_BASE_URL: 'https://www.klarpakke.no'
          PLAYWRIGHT_TEST_BASE_URL: 'https://www.klarpakke.no'

  # ============ AUTO-ROLLBACK (2026-08-09): rød innlogget smoke → rull tilbake
  # til forrige versjon FØR brukere treffer den brutte flyten, og varsl
  # Trello «🚨 Varsler». Dette er 2026-standarden (post-deploy smoke +
  # automatisk rollback).
  auto-rollback:
    needs: [deploy, e2e-smoke-auth-prod]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Finn forrige versjon og rull tilbake
        id: rollback
        run: |
          # wrangler versions list --json er IKKE sortert — sorter på created_on
          # og ta nest nyeste ([0] er den ødelagte versjonen vi nettopp deployet).
          # Guard: aldri JSON.parse på tomt svar; vis reell wrangler-feil i loggen.
          RAW=$(npx wrangler versions list --json 2>&1)
          if [ -z "$RAW" ]; then
            echo "::error::wrangler versions list returnerte tomt — sjekk CLOUDFLARE_API_TOKEN rettigheter (Workers Scripts: Read)"
            echo "rollback=manual" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          PREV_VERSION=$(echo "$RAW" | \
            node -e "const vs=JSON.parse(require('fs').readFileSync(0,'utf8'));vs.sort((a,b)=>new Date(b.metadata.created_on)-new Date(a.metadata.created_on));console.log(vs[1]?.id||'')")
          if [ -z "$PREV_VERSION" ]; then
            echo "::error::Fant ikke forrige versjon — manuell rollback kreves"
            echo "rollback=manual" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          npx wrangler versions deploy "$PREV_VERSION" --yes --message "AUTO-ROLLBACK: innlogget smoke feilet (${GITHUB_SHA::7})"
          echo "rollback=$PREV_VERSION" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: 'true'
          WRANGLER_LOG: error

      - name: Varsle Trello «🚨 Varsler»
        if: always()
        run: |
          curl -s -X POST "https://api.trello.com/1/cards" \
            --data-urlencode "key=${{ secrets.TRELLO_KEY }}" \
            --data-urlencode "token=${{ secrets.TRELLO_TOKEN }}" \
            --data-urlencode "idList=6a77a7b720d121385c010083" \
            --data-urlencode "name=🚨 AUTO-ROLLBACK: innlogget smoke feilet" \
            --data-urlencode "desc=Deploy ${GITHUB_SHA::7} feilet post-deploy innlogget smoke og ble rullet tilbake til ${{ steps.rollback.outputs.rollback }}.%0A%0ASjekk: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --data-urlencode "pos=top" > /dev/null
          echo "Trello-varsel sendt"
