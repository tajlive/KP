name: Slack Notify

on:
  workflow_call:
    inputs:
      message:
        description: 'The notification message text'
        required: true
        type: string
      color:
        description: 'Message color: good (green), warning (yellow), danger (red)'
        required: false
        default: 'danger'
        type: string
      workflow:
        description: 'Name of the calling workflow'
        required: false
        default: ''
        type: string
      run_url:
        description: 'URL to the workflow run'
        required: false
        default: ''
        type: string
    secrets:
      SLACK_WEBHOOK_URL:
        description: 'Slack Incoming Webhook URL'
        required: true
  workflow_dispatch:
    inputs:
      message:
        description: 'Notification message'
        required: true
        type: string
      color:
        description: 'Color (good/warning/danger)'
        required: false
        default: 'danger'
        type: string

jobs:
  notify:
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MESSAGE: ${{ inputs.message }}
          COLOR: ${{ inputs.color }}
          WORKFLOW: ${{ inputs.workflow || github.workflow }}
          RUN_URL: ${{ inputs.run_url || github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "⚠️  SLACK_WEBHOOK_URL not set — skipping notification"
            exit 0
          fi

          # Determine emoji and color
          EMOJI=""
          case "$COLOR" in
            good)   EMOJI="✅"; COLOR_HEX="#36a64f" ;;
            warning) EMOJI="⚠️"; COLOR_HEX="#daa038" ;;
            danger)  EMOJI="🚨"; COLOR_HEX="#d63865" ;;
            *)       EMOJI="ℹ️"; COLOR_HEX="#6a7280" ;;
          esac

          PAYLOAD=$(cat <<PAYLOADEOF
          {
            "attachments": [
              {
                "color": "$COLOR_HEX",
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": "$EMOJI $WORKFLOW",
                      "emoji": true
                    }
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "$MESSAGE"
                    }
                  },
                  {
                    "type": "actions",
                    "elements": [
                      {
                        "type": "button",
                        "text": {
                          "type": "plain_text",
                          "text": "🔍 View Run",
                          "emoji": true
                        },
                        "url": "$RUN_URL",
                        "style": "danger"
                      }
                    ]
                  },
                  {
                    "type": "context",
                    "elements": [
                      {
                        "type": "mrkdwn",
                        "text": "Repository: <https://github.com/${{ github.repository }}|${{ github.repository }}> | Ref: ${{ github.ref_name }}"
                      }
                    ]
                  }
                ]
              }
            ]
          }
          PAYLOADEOF
          )

          # Encode payload for Slack webhook (must use \n for newlines)
          echo "Sending notification to Slack..."
          RESPONSE=$(curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data-raw "$(echo "$PAYLOAD" | python3 -c 'import sys,json; print(json.dumps(json.load(sys.stdin)))')" \
            -w "%{http_code}" \
            -o /dev/null)

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Slack notification sent (HTTP $RESPONSE)"
          else
            echo "⚠️  Slack notification returned HTTP $RESPONSE"
          fi
