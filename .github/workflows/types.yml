# ============================================================================
# TypeScript Type Check + Supabase Type Generation
# Runs on push and PR to main
# ============================================================================

name: 🔷 Types Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: types-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run TypeScript type check
        run: npm run types:check

  verify-generated-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Generate Supabase types
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run types:gen

      - name: Verify types are in sync
        run: |
          if [ -n "$(git status --porcelain src/types/database.types.ts)" ]; then
            echo "❌ Supabase types are out of sync. Run 'npm run types:gen' locally and commit the changes."
            git diff src/types/database.types.ts | head -50
            exit 1
          fi
          echo "✅ Supabase types are in sync."
