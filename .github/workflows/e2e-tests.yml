# ============================================================================
# PLAYWRIGHT E2E-TESTER - Kun kritiske flows (sparer GitHub Actions minutter)
# ============================================================================

name: 🎭 E2E Critical Flows

on:
  schedule:
    - cron: "0 8 * * 1,4"  # 2 ganger per uke: mandag og torsdag kl 08:00
  workflow_dispatch:  # + manuell trigger
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/e2e/**"
      - "package*.json"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Timeout for å spare minutter
    
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline

      - name: 🎭 Install Playwright
        run: npx playwright install chromium  # Kun Chromium for å spare tid

      - name: 🏗️ Build (for lokale tester)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        timeout-minutes: 8

      - name: 🧪 Run E2E tests
        run: npx playwright test tests/e2e/critical-flows.spec.ts --reporter=line
        env:
          TEST_BASE_URL: ${{ github.event_name == 'pull_request' && 'http://localhost:3000' || 'https://klarpakke-185xaf38z-klarpakke.vercel.app' }}
        timeout-minutes: 5
        continue-on-error: true  # Ikke blokker PR på E2E-feil (enda)

      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
