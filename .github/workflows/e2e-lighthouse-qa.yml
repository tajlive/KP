name: E2E + Lighthouse QA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          PLAYWRIGHT_TEST_BASE_URL="https://www.klarpakke.no" \
          BASE_URL="https://www.klarpakke.no" \
          npx playwright test --config=playwright.allure.config.ts --project=chromium
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7

  lighthouse:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @lhci/cli
      - run: lhci autorun --config=.lighthouserc.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7
