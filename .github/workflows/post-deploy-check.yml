name: Post-Deploy Health Check

on:
  workflow_run:
    workflows: ["Deploy to Cloudflare Workers — Fallback"]
    types: [completed]

jobs:
  smoke-test:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Test all pages
        run: |
          BASE="https://www.klarpakke.no"
          ERRORS=0
          
          check() {
            code=$(curl -s -o /dev/null -w "%{http_code}" -m10 "$BASE$1")
            crash=$(curl -s -m10 "$BASE$1" | grep -c "Noe gikk galt" || true)
            if [ "$crash" -gt 0 ]; then echo "  ❌ $1 (Worker crash)"; ERRORS=$((ERRORS+1))
            elif [ "$code" = "200" ]; then echo "  ✅ $1"
            else echo "  ⚠️ $1 (HTTP $code)"; fi
          }
          
          echo "🏥 Post-deploy health check"
          for page in /no /no/priser /no/login /no/register /no/bots /no/leaderboard /no/om-oss /no/kontakt /api/health; do
            check "$page"
          done
          
          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ $ERRORS failures"
            exit 1
          fi
          echo "✅ All pages OK"
