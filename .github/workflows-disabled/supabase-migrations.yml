# ============================================================================
# SUPABASE – Migrations + Edge Functions
# Kjøres automatisk ved push til main
# Kan også trigges manuelt via workflow_dispatch
# ============================================================================

name: Supabase Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Migrasjon + Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 🔗 Link til Supabase-prosjekt
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: 🗄️ Push migrasjoner
        run: supabase db push

      - name: ⚡ Deploy alle Edge Functions
        run: |
          for dir in supabase/functions/*/; do
            func=$(basename "$dir")
            if [[ "$func" != _* ]]; then
              echo "→ Deployer function: $func"
              supabase functions deploy "$func" --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
            fi
          done

      - name: ✅ Sammendrag
        if: success()
        run: |
          echo "## ✅ Supabase Deploy OK" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Kjørt av | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tidspunkt | $(date -u) |" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Feil-sammendrag
        if: failure()
        run: |
          echo "## ❌ Supabase Deploy FEILET" >> $GITHUB_STEP_SUMMARY
          echo "Sjekk loggene: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
