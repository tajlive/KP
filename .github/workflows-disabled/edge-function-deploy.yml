# SIST OPPDATERT: 2026-04-02 - KLA-PROFIT1 Edge Function Auto-deploy
# ============================================================================
# EDGE FUNCTION DEPLOY – Auto-deploy ved push til main
# ============================================================================
# Deployer Supabase Edge Functions automatisk ved endringer.
#
# Triggers:
#   1. Push til main som endrer supabase/functions/**
#   2. Manuell workflow_dispatch
#
# Features:
#   - Health check etter deploy
#   - Slack-notifikasjon ved suksess/feil
#   - Linear-kommentar klar for KLA-PROFIT1
#
# Required secrets:
#   - SUPABASE_ACCESS_TOKEN
#   - SUPABASE_PROJECT_REF
#   - SLACK_WEBHOOK_URL (optional)
# ============================================================================

name: 🚀 Edge Function Deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/edge-function*.yml'
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Edge Function to deploy'
        required: true
        default: 'ensemble-signals'
        type: string

concurrency:
  group: edge-deploy-${{ github.ref }}
  cancel-in-progress: false

# Node 24 opt-in for JS actions — deprecation 2026
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FUNCTION_NAME: ${{ github.event.inputs.function_name || 'ensemble-signals' }}

jobs:
  deploy:
    name: 🚀 Deploy Edge Function
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'

      - name: 📦 Install Supabase CLI
        run: npm install -g supabase

      - name: 🔐 Verify secrets
        id: secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set"
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_PROJECT_REF }}" ]; then
            echo "::error::SUPABASE_PROJECT_REF is not set"
            exit 1
          fi
          echo "verified=true" >> $GITHUB_OUTPUT

      - name: 🚀 Deploy Edge Function
        id: deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -e
          echo "Deploying ${{ env.FUNCTION_NAME }}..."
          
          # Link to project
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          
          # Deploy the function
          supabase functions deploy "${{ env.FUNCTION_NAME }}" --use-api --yes
          
          echo "deployed=true" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: 🧪 Verify deployment
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          echo "Testing deployed function..."
          sleep 5
          
          # Test the endpoint
          curl -sfS "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/${{ env.FUNCTION_NAME }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            --max-time 10 || echo "::warning::Health check returned non-200"

      - name: 📋 Deploy Summary
        if: always()
        run: |
          echo "## 🚀 Edge Function Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Function:** ${{ env.FUNCTION_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.deploy.outputs.deployed == 'true' && '✅ Success' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.deploy.outputs.deployed }}" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**URL:** https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/${{ env.FUNCTION_NAME }}" >> $GITHUB_STEP_SUMMARY
          fi

      # ============================================================================
      # Notifications
      # ============================================================================
      
      - name: 💬 Notify Slack - Success
        if: steps.deploy.outputs.deployed == 'true' && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"text\": \"✅ Edge Function Deployed: ${{ env.FUNCTION_NAME }}\",
              \"blocks\": [
                {\"type\": \"header\", \"text\": {\"type\": \"plain_text\", \"text\": \"🚀 Edge Function Deployed\"}},
                {\"type\": \"section\", \"fields\": [
                  {\"type\": \"mrkdwn\", \"text\": \"*Function:*\\n${{ env.FUNCTION_NAME }}\"},
                  {\"type\": \"mrkdwn\", \"text\": \"*Status:*\\n✅ Success\"},
                  {\"type\": \"mrkdwn\", \"text\": \"*Commit:*\\n${{ github.sha }}\"},
                  {\"type\": \"mrkdwn\", \"text\": \"*Branch:*\\n${{ github.ref_name }}\"}
                ]}
              ]
            }" \
            $SLACK_WEBHOOK_URL

      - name: 💬 Notify Slack - Failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"text\": \"❌ Edge Function Deploy Failed: ${{ env.FUNCTION_NAME }}\",
              \"blocks\": [
                {\"type\": \"header\", \"text\": {\"type\": \"plain_text\", \"text\": \"❌ Edge Function Deploy Failed\"}},
                {\"type\": \"section\", \"fields\": [
                  {\"type\": \"mrkdwn\", \"text\": \"*Function:*\\n${{ env.FUNCTION_NAME }}\"},
                  {\"type\": \"mrkdwn\", \"text\": \"*Status:*\\n❌ Failed\"}
                ]},
                {\"type\": \"section\", \"text\": {\"type\": \"mrkdwn\", \"text\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>\"}}
              ]
            }" \
            $SLACK_WEBHOOK_URL || true

      # Linear-kommentar format (klar for manuell bruk eller videre automatisering)
      - name: 📌 Linear Comment Format
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          echo "## Linear Comment Format for KLA-PROFIT1:"
          echo ""
          echo '```'
          echo "✅ Edge Function \`${{ env.FUNCTION_NAME }}\` deployed"
          echo ""
          echo "- Commit: \`${{ github.sha }}\`"
          echo "- Timestamp: ${{ steps.deploy.outputs.timestamp }}"
          echo "- URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/${{ env.FUNCTION_NAME }}"
          echo '```'
