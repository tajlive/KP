# Optimized Test Workflow for Klarpakke
# Kalibrert for maksimal hastighet og pålitelighet

name: 🧪 Test Optimized

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.14.1"
  NPM_CONFIG_LEGACY_PEER_DEPS: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  # Test optimalisering
  VITEST_MAX_WORKERS: "2"
  PLAYWRIGHT_WORKERS: "2"
  CI: "true"

jobs:
  # ============================================
  # UNIT TESTS (Raske, parallelle)
  # ============================================
  unit-tests:
    name: ⚡ Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    strategy:
      matrix:
        shard: [1, 2, 3, 4]  # 4-way parallelisering
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          node-version-file: ".nvmrc"
          cache: "npm"
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Run Unit Tests (Shard ${{ matrix.shard }}/4)
        run: |
          npm run test:unit -- \
            --shard=${{ matrix.shard }}/4 \
            --reporter=default \
            --reporter=junit \
            --outputFile=test-results/junit-${{ matrix.shard }}.xml
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results-${{ matrix.shard }}
          path: test-results/junit-${{ matrix.shard }}.xml
          retention-days: 7

  # ============================================
  # COVERAGE (En gang, etter unit tests)
  # ============================================
  coverage:
    name: 📊 Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit-tests
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          node-version-file: ".nvmrc"
          cache: "npm"
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Run Coverage
        run: npm run test:coverage -- --reporter=json --outputFile=coverage/coverage.json
      
      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ============================================
  # E2E SMOKE (Kritiske stier, raske)
  # ============================================
  e2e-smoke:
    name: 🔥 E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          node-version-file: ".nvmrc"
          cache: "npm"
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Install Playwright
        run: npx playwright install chromium
      
      - name: Build app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      
      - name: Run Smoke Tests
        run: npm run test:e2e:smoke
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

  # ============================================
  # E2E CRITICAL (Kjernejourney, parallelisert)
  # ============================================
  e2e-critical:
    name: 🎯 E2E Critical
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: e2e-smoke
    
    strategy:
      matrix:
        browser: [chromium]  # Firefox kjøres separat hvis behov
        shard: [1, 2]  # 2-way parallelisering
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          node-version-file: ".nvmrc"
          cache: "npm"
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Install Playwright
        run: npx playwright install ${{ matrix.browser }}
      
      - name: Build app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      
      - name: Provision Test Users
        run: npm run test:e2e:provision:env
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      
      - name: Run Critical Tests
        run: |
          npm run test:e2e:critical:${{ matrix.browser }} -- \
            --shard=${{ matrix.shard }}/2
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          KLARPAKKE_E2E_FROM_PROVISION: "1"

  # ============================================
  # P0 INTEGRATION (DB-avhengige tester)
  # ============================================
  p0-integration:
    name: 🛡️ P0 Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit-tests
    if: contains(github.event.head_commit.message, '[p0]') || github.event_name == 'workflow_dispatch'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          node-version-file: ".nvmrc"
          cache: "npm"
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Run P0 Tests
        run: npm run test:unit -- src/lib/trading/__tests__/p0-*.test.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # ============================================
  # TEST SUMMARY
  # ============================================
  test-summary:
    name: 📋 Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, coverage, e2e-smoke, e2e-critical]
    if: always()
    
    steps:
      - name: Download All Results
        uses: actions/download-artifact@v4
        with:
          path: test-results
          pattern: unit-test-results-*
      
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results/**/*.xml
          check_name: 🧪 Test Results
