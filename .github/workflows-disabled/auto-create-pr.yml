# ============================================================================
# DEAKTIVERT (mars 2026): Flyttet hit fra workflows/
# ============================================================================
# GitHub blokkerer GITHUB_TOKEN fra å opprette PR (createPullRequest) i mange
# repos — workflow feilet alltid med rød sjekk uten org-endring.
# PR-opprettelse: `npm run pr`, `./scripts/create-pr.sh`, eller Cursor
# ManagePullRequest. Se docs/GITHUB-PR-AUTOMATION.md.
# ============================================================================

name: 📋 Auto-create PR

on:
  push:
    branches:
      - 'cursor/**'
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: ⬇️ Checkout (gh CLI trenger git-kontekst)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check if PR exists
        id: check
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          COUNT=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq 'length')
          echo "exists=$COUNT" >> $GITHUB_OUTPUT

      - name: Create PR if not exists
        if: steps.check.outputs.exists == '0'
        run: |
          BRANCH="${{ steps.check.outputs.branch }}"
          TITLE=$(echo "$BRANCH" | sed 's/^[^\/]*\///' | sed 's/-/ /g' | sed 's/\b\(.\)/\u\1/g')
          BODY="Automatisk opprettet PR fra branch \`$BRANCH\`."
          BODY+=$'\n\n'
          if [ -f .github/pull_request_template.md ]; then
            BODY+=$(cat .github/pull_request_template.md)
          fi
          gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY" --draft
          echo "✅ PR opprettet for $BRANCH"
