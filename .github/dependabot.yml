# Dependabot Configuration — DISABLED 2026-07-01
# GitHub Actions is disabled in the tajlive-KP org due to budget limits, so
# Dependabot PRs cannot run CI. open-pull-requests-limit is set to 0 to stop
# new PR noise. Re-enable by raising the Actions budget and setting limits back.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"

    # Ukentlig sjekk (mandag morgen)
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Oslo"

    # Maks antall åpne PR-er
    open-pull-requests-limit: 0

    # Separer patch/minor og major for bedre kontroll
    groups:
      production-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

      production-major:
        patterns:
          - "*"
        update-types:
          - "major"

      development-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
          - "major"

    # ESLint 10 er foreløpig blokkert av plugin-økosystemet (eslint-plugin-react,
    # eslint-plugin-import). Fjern denne ignore-linja når økosystemet er klart.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

    # Oppdater package.json kun når det er nødvendig (f.eks. major-sprang)
    versioning-strategy: "increase-if-necessary"

    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"

    labels:
      - "dependencies"
      - "automated"

    rebase-strategy: "auto"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
      - "github-actions"
